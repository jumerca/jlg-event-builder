<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JLG Creative — Flipbook</title>
<style>
:root{--navy:#0b2232;--gold:#c79a43;--cream:#f4efe6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071722;color:var(--cream);font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:#0a1d2a;position:relative;z-index:5}
header{position:sticky;top:0;border-bottom:1px solid rgba(255,255,255,.12)}
.brand{font-weight:700;letter-spacing:.04em}.brand span{font-weight:400;opacity:.7}
.tools{display:flex;align-items:center;gap:7px}
button{border:1px solid rgba(255,255,255,.18);background:#173247;color:#fff;border-radius:999px;min-width:44px;min-height:44px;font-size:22px;cursor:pointer}
button:disabled{opacity:.3;cursor:not-allowed}
#zoomLabel{font-size:13px;min-width:48px;text-align:center}
main{flex:1;display:grid;grid-template-columns:60px minmax(0,1fr) 60px;align-items:center;gap:10px;padding:16px}
.stage{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;perspective:1400px}
.page{position:relative;width:min(78vw,650px);aspect-ratio:550/777;overflow:hidden;background:#fff;box-shadow:0 18px 48px rgba(0,0,0,.45);border-radius:4px;transform-origin:left center;transition:transform .2s ease,filter .2s ease}
.page img{position:absolute;left:0;top:0;width:100%;height:auto;max-width:none;user-select:none;pointer-events:none;transition:transform .18s ease;will-change:transform}
.page.turn-next{transform:rotateY(-11deg) scale(.99);filter:brightness(.92)}
.page.turn-prev{transform-origin:right center;transform:rotateY(11deg) scale(.99);filter:brightness(.92)}
.nav{font-size:38px}
footer{border-top:1px solid rgba(255,255,255,.12);font-size:13px}.hint{opacity:.65}
@media(max-width:700px){main{grid-template-columns:48px minmax(0,1fr) 48px;padding:10px 6px;gap:5px}.page{width:min(84vw,620px)}.brand span{display:none}}
@media(max-width:430px){main{grid-template-columns:1fr;position:relative}.page{width:min(92vw,600px)}.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;background:rgba(14,38,55,.9)}#prev{left:8px}#next{right:8px}.hint{display:none}}
</style>
</head>
<body>
<header>
<div class="brand">JLG Creative <span>• Créations hôtelières</span></div>
<div class="tools"><button id="minus" aria-label="Réduire">−</button><span id="zoomLabel">100%</span><button id="plus" aria-label="Agrandir">+</button><button id="full" aria-label="Plein écran">⛶</button></div>
</header>
<main>
<button id="prev" class="nav" aria-label="Page précédente">‹</button>
<div class="stage" id="stage"><div class="page" id="page"><img id="sprite" src="./flipbook-pages.jpg" alt="Créations JLG Creative"></div></div>
<button id="next" class="nav" aria-label="Page suivante">›</button>
</main>
<footer><span id="label">Page 1 / 10</span><span class="hint">Glissez, cliquez ou utilisez ← →</span></footer>
<script>
const total=10;let page=0,zoom=1,startX=null;
const frame=document.getElementById('page'),sprite=document.getElementById('sprite'),prev=document.getElementById('prev'),next=document.getElementById('next'),label=document.getElementById('label'),zoomLabel=document.getElementById('zoomLabel'),stage=document.getElementById('stage');
function render(){sprite.style.transform='translateY(-'+(page*10)+'%)';label.textContent='Page '+(page+1)+' / '+total;prev.disabled=page===0;next.disabled=page===total-1;frame.style.scale=zoom;zoomLabel.textContent=Math.round(zoom*100)+'%'}
function go(target,dir){if(target<0||target>=total||target===page)return;frame.classList.add(dir==='next'?'turn-next':'turn-prev');setTimeout(()=>{page=target;render();frame.classList.remove('turn-next','turn-prev')},130)}
prev.onclick=()=>go(page-1,'prev');next.onclick=()=>go(page+1,'next');
document.getElementById('plus').onclick=()=>{zoom=Math.min(1.5,+(zoom+.1).toFixed(1));render()};
document.getElementById('minus').onclick=()=>{zoom=Math.max(.7,+(zoom-.1).toFixed(1));render()};
document.getElementById('full').onclick=async()=>{if(!document.fullscreenElement&&stage.requestFullscreen)await stage.requestFullscreen();else if(document.exitFullscreen)await document.exitFullscreen()};
frame.addEventListener('pointerdown',e=>startX=e.clientX);frame.addEventListener('pointerup',e=>{if(startX===null)return;const dx=e.clientX-startX;startX=null;if(Math.abs(dx)>45)go(page+(dx<0?1:-1),dx<0?'next':'prev')});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(page+1,'next');if(e.key==='ArrowLeft'||e.key==='PageUp')go(page-1,'prev');if(e.key==='Home')go(0,'prev');if(e.key==='End')go(total-1,'next')});
sprite.addEventListener('error',()=>{frame.innerHTML='<div style="color:#0b2232;padding:25px;text-align:center;font:16px Arial">Le flipbook n’a pas pu charger ses pages.</div>'});
render();
</script>
</body>
</html>
