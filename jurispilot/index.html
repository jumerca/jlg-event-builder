<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09172f"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JurisPilot"><title>JurisPilot</title><style>html,body{margin:0;min-height:100%;background:#09172f;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:white}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.mark{width:82px;height:82px;margin:auto;border-radius:24px;overflow:hidden}.mark img{width:100%;height:100%;display:block}.boot h1{margin:18px 0 6px}.boot p{opacity:.75;line-height:1.5;font-size:13px}</style></head><body><div class="boot"><div><div class="mark"><img src="./icon-192.png" alt="JurisPilot"></div><h1>JurisPilot</h1><p>Chargement de votre application juridique…</p></div></div><script>(async()=>{try{const src='https://raw.githubusercontent.com/jumerca/onmangequoi/jurispilot-build/app/src/main/assets/v3.html';const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let h=await r.text();const extras=`<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JurisPilot"><style>#jpInstall{position:fixed;right:14px;bottom:82px;z-index:120;border:0;border-radius:999px;padding:12px 16px;background:#d8b064;color:#09172f;font-weight:950;font-size:12px;box-shadow:0 8px 24px #0004;display:block}#jpInstall:active{transform:scale(.98)}@media(display-mode:standalone){#jpInstall{display:none}}</style>`;h=h.replace('</head>',extras+'</head>');const bootScript=`<button id="jpInstall" type="button">⬇ Installer JurisPilot</button><script>let jpPrompt=null;const ib=document.getElementById('jpInstall');const installed=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(installed()&&ib)ib.style.display='none';window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();jpPrompt=e;if(ib)ib.style.display='block'});window.addEventListener('appinstalled',()=>{jpPrompt=null;if(ib)ib.style.display='none'});ib&&ib.addEventListener('click',async()=>{if(installed()){ib.style.display='none';return}if(jpPrompt){jpPrompt.prompt();await jpPrompt.userChoice;jpPrompt=null;return}if(/iPad|iPhone|iPod/.test(navigator.userAgent)){alert('Pour installer JurisPilot : touchez Partager puis Ajouter à l’écran d’accueil.');return}alert('Installation prête. Dans Chrome ou Samsung Internet, ouvrez le menu ⋮ puis choisissez Installer l’application ou Ajouter à l’écran d’accueil. Si l’option n’apparaît pas encore, rechargez cette page une fois.');});if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).catch(()=>{});}document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a&&/^https?:/i.test(a.href)&&new URL(a.href).hostname!==location.hostname){a.target='_blank';a.rel='noopener';}});<\/script>`;h=h.replace('</body>',bootScript+'</body>');document.open();document.write(h);document.close();}catch(e){document.body.innerHTML='<div class="boot"><div><div class="mark"><img src="./icon-192.png" alt="JurisPilot"></div><h1>JurisPilot</h1><p>Impossible de charger l’application. Vérifiez votre connexion puis réessayez.</p></div></div>';}})();</script></body></html>
