<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09172f"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JurisPilot"><title>JurisPilot</title><style>html,body{margin:0;min-height:100%;background:#09172f;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:white}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.mark{width:82px;height:82px;margin:auto;border-radius:24px;background:#d8b064;display:grid;place-items:center;font-size:42px;color:#09172f}.boot h1{margin:18px 0 6px}.boot p{opacity:.75;line-height:1.5;font-size:13px}</style></head><body><div class="boot"><div><div class="mark">⚖</div><h1>JurisPilot</h1><p>Chargement de votre application juridique…</p></div></div><script>(async()=>{try{const src='https://raw.githubusercontent.com/jumerca/onmangequoi/jurispilot-build/app/src/main/assets/v3.html';const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let h=await r.text();const extras=`<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JurisPilot"><style>#jpInstall{position:fixed;right:14px;bottom:82px;z-index:120;border:0;border-radius:999px;padding:11px 15px;background:#d8b064;color:#09172f;font-weight:900;box-shadow:0 8px 24px #0003;display:none}</style>`;h=h.replace('</head>',extras+'</head>');const bootScript=`<button id="jpInstall">Installer JurisPilot</button><script>let jpPrompt=null;const ib=document.getElementById('jpInstall');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();jpPrompt=e;ib.style.display='block'});ib&&ib.addEventListener('click',async()=>{if(jpPrompt){jpPrompt.prompt();await jpPrompt.userChoice;jpPrompt=null;ib.style.display='none'}else if(/iPad|iPhone|iPod/.test(navigator.userAgent)){alert('Sur iPhone : Partager puis Ajouter à l’écran d’accueil.')}else{alert('Dans le menu du navigateur, choisissez Installer l’application ou Ajouter à l’écran d’accueil.')}});if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a&&/^https?:/i.test(a.href)&&new URL(a.href).hostname!==location.hostname){a.target='_blank';a.rel='noopener';}});<\/script>`;h=h.replace('</body>',bootScript+'</body>');document.open();document.write(h);document.close();}catch(e){document.body.innerHTML='<div class="boot"><div><div class="mark">⚖</div><h1>JurisPilot</h1><p>Impossible de charger l’application. Vérifiez votre connexion puis réessayez.</p></div></div>';}})();</script></body></html>
