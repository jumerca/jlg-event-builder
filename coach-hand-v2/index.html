:root{
  --navy:#0b2a4a;--blue:#136df0;--blue2:#eaf3ff;--orange:#ff7a18;--ink:#172334;--muted:#6e7d90;--bg:#f6f8fb;--card:#fff;--line:#dce5ef;--green:#16a36a;--red:#df3d47;--yellow:#ffd43b;

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app-shell{min-height:100dvh;padding-bottom:82px}.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(246,248,251,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(220,229,239,.75)}.brand{border:0;background:transparent;display:flex;align-items:center;gap:10px;color:var(--navy);font-size:18px;cursor:pointer;padding:0}.brand em{font-style:normal;color:var(--orange);margin-left:3px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--orange));box-shadow:var(--shadow)}.icon-btn{border:0;background:#fff;border-radius:12px;padding:9px 11px;box-shadow:var(--shadow)}.top-actions{display:flex;align-items:center;gap:8px}.cloud-pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;display:flex;align-items:center;gap:7px;color:var(--navy);font-weight:850;font-size:12px;box-shadow:0 5px 14px rgba(11,42,74,.06);cursor:pointer}.cloud-dot{width:9px;height:9px;border-radius:50%;background:#9aa8b8;box-shadow:0 0 0 4px rgba(154,168,184,.12)}.cloud-dot.ok{background:#16a36a;box-shadow:0 0 0 4px rgba(22,163,106,.12)}.cloud-dot.sync{background:#136df0;box-shadow:0 0 0 4px rgba(19,109,240,.12);animation:cloudPulse 1.2s infinite}.cloud-dot.warn{background:#ff7a18;box-shadow:0 0 0 4px rgba(255,122,24,.12)}.cloud-dot.offline{background:#9aa8b8}@keyframes cloudPulse{50%{opacity:.35;transform:scale(.75)}}main{width:min(1120px,100%);margin:0 auto;padding:18px}.hero{background:linear-gradient(145deg,#0b2a4a 0%,#114f8f 100%);color:#fff;border-radius:30px;padding:26px 22px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-80px;background:rgba(255,122,24,.22)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9fc7ff}.hero h1{font-size:clamp(30px,7vw,54px);line-height:.98;margin:10px 0}.hero p{max-width:620px;color:#dcecff}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:16px;padding:13px 16px;font-weight:800;cursor:pointer;transition:.2s transform,.2s box-shadow}.btn:active{transform:scale(.98)}.btn-primary{background:var(--orange);color:white;box-shadow:0 10px 24px rgba(255,122,24,.28)}.btn-secondary{background:white;color:var(--navy)}.btn-ghost{background:var(--blue2);color:var(--blue)}.btn-danger{background:#fff0f1;color:var(--red)}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.section h2{margin:0;font-size:21px}.section p.muted,.muted{color:var(--muted)}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 6px 18px rgba(11,42,74,.05)}.action-card{cursor:pointer;min-height:142px;display:flex;flex-direction:column;justify-content:space-between}.action-card .icon{font-size:26px}.action-card h3{margin:12px 0 4px}.action-card p{margin:0;color:var(--muted);font-size:14px}.action-card.accent{background:#fff7ef;border-color:#ffd6b5}.form-grid{display:grid;gap:14px}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font:inherit;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8eb9ff;box-shadow:0 0 0 4px #eaf3ff}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 10px;border-radius:999px;font-size:13px;cursor:pointer}.chip.active{background:var(--navy);color:white;border-color:var(--navy)}.session-summary{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin:14px 0}.stat{background:#f2f6fb;border-radius:15px;padding:12px}.stat strong{display:block;font-size:18px}.timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:8px;top:12px;bottom:10px;width:2px;background:#d7e5f7}.timeline-item{position:relative;margin:0 0 14px}.timeline-item:before{content:"";position:absolute;left:-20px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:3px solid #dbeaff}.timeline-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.timeline-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.duration{color:var(--orange);font-weight:900;white-space:nowrap}.why{margin-top:10px;background:#f5f9ff;border-radius:12px;padding:10px 12px;font-size:13px;color:#36516f}.timeline-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.mini{padding:9px 11px;border-radius:12px;font-size:13px}.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#eef4fb;color:#49627d;font-size:12px;font-weight:700;margin:3px 5px 0 0}.tag.orange{background:#fff0e3;color:#c95a06}.exercise-grid{display:grid;gap:12px}.exercise-card{cursor:pointer}.exercise-card h3{margin:8px 0 5px}.exercise-card p{margin:0;color:var(--muted);font-size:14px}.mini-court{margin:-6px -6px 12px;border-radius:16px;overflow:hidden;background:#0e77c7;padding:7px}.mini-court .court{aspect-ratio:1.7/1;border-width:2px}.mini-court .player{width:24px;height:24px;font-size:9px;box-shadow:0 2px 6px rgba(0,0,0,.18)}.mini-court .ball{width:9px;height:9px}.mini-court .goal{border-width:3px;height:7%}.mini-court .line6{border-width:2px}.mini-court .line9{border-width:2px}.mini-court .arrow{height:2px}.mini-court .arrow:after{border-left-width:6px;border-top-wid const exercises = rawExercises.map(([id,title,category,duration,players,keywords,scheme])=>enrichExercise({id,title,category,duration,players,keywords,scheme}));

function enrichExercise(e){
  const baby=e.category==='Baby Hand';
  const templates={
    activation:{setup:'4 zones matérialisées par des plots. Les joueurs circulent avec ballon et changent de zone au signal.',process:'Enchaîner mobilité, passes courtes, changements de rythme puis prises d’information avant réception.',coach:['Ballon vivant dès le départ.','Regarder avant de recevoir.','Changer de rythme sans perdre la qualité.'],observe:['Disponibilité des joueurs','Orientation avant réception','Qualité des appuis']},
    pass:{setup:'Deux couloirs de circulation, porteurs et partenaires espacés de manière à obliger une vraie fixation.',process:'Recevoir en mouvement, menacer l’intervalle, fixer puis transmettre au partenaire lancé.',coach:['Menacer avant de passer.','Donner la balle dans la course.','Se replacer immédiatement après transmission.'],observe:['Distance de fixation','Timing de passe','Continuité du non-porteur']},
    duel1:{setup:'Un attaquant, un défenseur et un gardien. Départ lancé à 10-11 m.',process:'L’attaquant choisit son intervalle, provoque le défenseur et cherche à finir sans perdre la menace de tir.',coach:['Attaquer l’épaule du défenseur.','Changer de rythme tard.','Protéger le ballon sur le duel.'],observe:['Premier appui','Changement de direction','Capacité à finir après contact']},
    duel2:{setup:'2 attaquants contre 2 défenseurs dans un secteur central élargi.',process:'Le porteur provoque un duel réel. Si l’aide vient, transmission au partenaire qui attaque le nouvel intervalle.',coach:['Fixer un défenseur, pas un espace vide.','Le partenaire doit rester disponible.','Continuer après la passe.'],observe:['Qualité de fixation','Lecture de l’aide','Enchaînement du partenaire']},
    shoot:{setup:'Deux postes de tir, un défenseur semi-actif et un gardien.',process:'Réception lancée, fixation courte puis choix du tir selon la position du défenseur et du gardien.',coach:['Monter vers le but.','Armer tard.','Varier haut/bas et proche/loin.'],observe:['Équilibre au tir','Lecture gardien','Qualité du dernier appui']},
    gk:{setup:'Gardien au but, deux sources de tir distinctes et des ballons prêts.',process:'Alterner les secteurs de tir pour obliger lecture, déplacement puis replacement rapide.',coach:['Rester haut sur les appuis.','Lire le bras avant de partir.','Se replacer avant le tir suivant.'],observe:['Position de départ','Déclenchement de la parade','Vitesse de replacement']},
    transition:{setup:'Départ proche du but avec gardien, trois couloirs clairement identifiés.',process:'Relance rapide puis occupation largeur/profondeur. La 2e vague doit arriver sans fermer les couloirs de la 1re.',coach:['Écarter immédiatement.','Courir vers l’avant avant de demander la balle.','La passe doit gagner du temps.'],observe:['Largeur','Profondeur','Timing de relance']},
    repli:{setup:'Une équipe attaque, l’autre se prépare à réagir à la perte sur trois zones prioritaires.',process:'Au signal ou à la perte, retour immédiat : priorité axe, puis ballon, puis répartition des joueurs.',coach:['Protéger l’axe d’abord.','Communiquer très tôt.','Freiner sans se jeter.'],observe:['Première course de repli','Répartition','Communication']},
    d60:{setup:'Six défenseurs alignés près des 6 m, attaque placée complète ou réduite selon effectif.',process:'Faire circuler avec menace, fixer les centraux, changer de secteur et exploiter le pivot ou l’intervalle créé.',coach:['Pas de circulation stérile.','Fixer avant de renverser.','Garder de la largeur.'],observe:['Désalignement des 6 défenseurs','Qualité de fixation','Continuité après le renversement']},
    d51:{setup:'Cinq défenseurs bas + un défenseur avancé. Attaque en largeur.',process:'Attirer l’avancé, jouer dans son dos ou renverser vite pour créer un surnombre sur la ligne basse.',coach:['Ne pas dribbler face à l’avancé sans intention.','Chercher l’espace derrière lui.','Renverser plus vite que le replacement.'],observe:['Occupation de l’espace derrière l’avancé','Timing du renversement','Mobilité du pivot']},
    d123:{setup:'Défense étagée : 1 joueur proche des 6 m, 2 joueurs en deuxième rideau, 3 joueurs hauts. L’attaque doit identifier les espaces entre lignes.',process:'Fixer la première ligne, déplacer la deuxième puis jouer rapidement dans le dos des joueurs hauts ou renverser côté opposé.',coach:['Attirer avant de jouer derrière.','Ne pas rester à plat face aux 3 joueurs hauts.','Faire vivre le pivot dans les espaces interlignes.'],observe:['Lecture des trois lignes','Jeu dans le dos','Renversement côté faible']},
    d321:{setup:'Défense étagée 3-2-1 : trois défenseurs bas, deux intermédiaires et une pointe avancée. L’attaque conserve largeur et profondeur.',process:'Fixer la pointe, proposer une solution dans son dos, attirer un intermédiaire puis renverser ou jouer avec le pivot.',coach:['Ne pas subir la pointe.','Occuper le dos de la première ligne.','Renverser avant le replacement des intermédiaires.'],observe:['Fixation de la pointe','Disponibilité interligne','Vitesse de renversement']},
    d42:{setup:'Quatre défenseurs bas et deux avancés. L’attaque garde de la largeur avec un joueur disponible dans le dos.',process:'Fixer un avancé, jouer derrière lui puis renverser avant le retour du deuxième avancé.',coach:['Créer une solution derrière les avancés.','Éviter les passes latérales molles.','Utiliser le pivot pour bloquer une sortie.'],observe:['Jeu dans le dos','Timing des blocs','Vitesse de renversement']},
    pivot:{setup:'Défense 6-0, pivot entre deux centraux, trois arrières et éventuellement les ailes.',process:'La balle circule, un arrière fixe réellement, le pivot se déplace avec la défense puis reçoit ou libère l’intervalle.',coach:['Le pivot crée avant de recevoir.','Fixation crédible.','Passe au bon timing, pas automatique.'],observe:['Position du pivot','Réaction des centraux','Timing de passe']},
    overload:{setup:'Zone réduite avec un attaquant de plus que les défenseurs.',process:'Faire circuler jusqu’à obtenir deux défenseurs sur un même joueur, puis jouer immédiatement le joueur libre.',coach:['Ne pas précipiter.','Fixer avant de transmettre.','Le joueur libre doit être visible.'],observe:['Lecture du surnombre','Vitesse de balle','Qualité de finition']},
    placed:{setup:'Attaque placée face à six défenseurs, avec positions repérées.',process:'Déclencher le mouvement annoncé, créer une réaction défensive puis conserver la continuité jusqu’à la meilleure solution.',coach:['Le système ne doit pas tuer la lecture.','Tous les joueurs restent dangereux.','Continuer si la première solution est fermée.'],observe:['Synchronisation','Menace des non-porteurs','Continuité']},
    baby:{setup:'Petit espace sécurisé avec 4 à 8 plots colorés et un ballon léger par enfant ou par binôme.',process:'L’histoire donne la mission : courir, transporter, viser ou déposer. Les séquences sont très courtes, avec beaucoup de réussites et presque pas d’attente.',coach:['Donner une consigne à la fois.','Faire jouer avant de corriger.','Valoriser l’exploration et la réussite.'],observe:['Plaisir et engagement','Repérage dans l’espace','Coordination générale']},
    'baby-match':{setup:'Terrain très réduit avec deux grandes zones-cibles. Équipes de 3, sans gardien.',process:'Faire avancer la balle en passes ou en transport contrôlé et marquer en posant ou lançant dans la zone-cible.',coach:['Changer souvent les équipes.','Pas de poste fixe.','Tout le monde touche le ballon.'],observe:['Participation','Repérage partenaires/adversaires','Envie d’aller vers la cible']}
  };
  const t=templates[e.scheme]||templates.placed;
  return {...e,
    objective:e.objective||objectiveFor(e.category,e.title),
    material:e.material||(baby?'Ballons souples, plots colorés, cerceaux, chasubles':'Ballons, plots, chasubles'),
    setup:e.setup||t.setup,process:e.process||t.process,coach:e.coach||t.coach,observe:e.observe||t.observe,
    easier:baby?'Réduire la distance, supprimer l’opposition et agrandir les cibles.':'Réduire l’opposition et agrandir l’espace utile.',
    harder:baby?'Ajouter un choix de couleur, un changement de direction ou une contrainte de coopération.':'Défense libre, contrainte de temps ou limitation du nombre de passes.',
    errors:e.errors||errorsFor(e.scheme,baby),
    corrections:e.corrections||correctionsFor(e.scheme,baby,t.coach),
    criteria:e.criteria||criteriaFor(e.scheme,baby),
    why:baby?'On développe d’abord motricité, repères, manipulation et plaisir de jouer avant toute logique tactique.':'Cet exercice isole le comportement clé avant de le réinvestir dans une situation plus complexe.'
  };
}
function errorsFor(s,baby){if(baby)return ['Trop d’attente entre deux passages','Consigne trop longue ou trop technique','Espace mal dimensionné qui crée collisions ou échec'];const m={activation:['Joueurs à l’arrêt avant réception','Ballon qui ralentit le déplacement','Intensité trop haute trop tôt'],pass:['Passe sans menace préalable','Partenaire qui attend la balle statique','Distance de fixation trop grande'],duel1:['Duel déclenché trop loin','Changement de direction trop tôt','Ballon exposé au contact'],duel2:['Deux attaquants sur la même ligne','Fixation sans attirer réellement l’aide','Passe avant que l’avantage soit créé'],shoot:['Tir déséquilibré','Armé trop précoce','Choix de zone décidé avant lecture du gardien'],gk:['Départ de parade avant le déclenchement du tir','Appuis trop bas ou figés','Replacement lent entre deux tirs'],transition:['Couloirs refermés trop tôt','Tous les joueurs demandent la balle','Relance qui ne fait pas gagner de temps'],repli:['Regarder la perte au lieu de courir','Revenir vers son joueur plutôt que protéger l’axe','Communication trop tardive'],d60:['Circulation latérale sans fixation','Arrières à plat','Pivot immobile entre les centraux'],d51:['Jouer uniquement face à l’avancé','Espace derrière l’avancé non occupé','Renversement trop lent'],d123:['Rester devant les trois défenseurs hauts','Porteurs qui dribblent sans fixer','Aucun joueur entre les lignes'],d321:['Subir la pointe','Passe latérale sans attaquer son dos','Ailes qui rentrent trop tôt'],d42:['Deux avancés jamais fixés','Passe risquée au-dessus de la pression','Base arrière trop proche'],pivot:['Pivot qui réclame la balle sans créer d’espace','Passe intérieure forcée','Bloc statique trop tôt'],overload:['Tir avant d’avoir fixé deux défenseurs','Joueur libre mal espacé','Circulation trop lente'],placed:['Lancement récité sans lecture','Non-porteurs non dangereux','Arrêt du jeu si option 1 fermée']};return m[s]||['Rythme trop faible','Consigne non respectée','Pas de transfert vers une situation de match'];}
function correctionsFor(s,baby,coach){if(baby)return ['Réduire immédiatement la consigne à une phrase','Faire repartir vite après chaque réussite','Agrandir ou simplifier la zone avant de corriger le geste'];return (coach||[]).map((x,i)=>i===0?'Stop court : '+x:i===1?'Relance : '+x:'Repère : '+x);}
function criteriaFor(s,baby){if(baby)return ['80 % des enfants en mouvement','Très peu d’attente','Majorité de réussites et envie de recommencer'];const m={activation:['Réceptions majoritairement en mouvement','Peu de ballons perdus','Intensité qui monte progressivement'],pass:['Fixation visible avant transmission','Passe reçue dans la course','Continuité immédiate après la passe'],duel1:['Duel engagé à distance utile','Avantage créé sur les deux premiers appuis','Finition équilibrée'],duel2:['Un défenseur réellement fixé','Joueur libre identifié tôt','Avantage conservé après la première passe'],shoot:['Tirs pris en équilibre','Variété des zones de finition','Choix adapté à la position du gardien'],gk:['Position de départ stable','Déclenchement de parade après lecture','Replacement avant le tir suivant'],transition:['Largeur occupée dès la relance','Ballon avance plus vite que le repli','Tir de qualité ou passage propre en jeu placé'],repli:['Axe protégé dans les premières secondes','Porteur adverse freiné','Répartition claire sans deux joueurs sur la même menace'],d60:['Au moins un défenseur désaligné avant la finition','Fixation réelle avant renversement','Pivot ou côté faible exploité sans forcer'],d51:['Espace derrière l’avancé occupé','Renversement avant sa reformation','Ligne basse obligée de coulisser'],d123:['Réception entre les lignes','Première ligne fixée avant passe','Renversement joué avant replacement'],d321:['Pointe attirée hors de sa zone utile','Solution proposée dans son dos','Deuxième ligne obligée de choisir'],d42:['Un avancé fixé avant jeu derrière','Base arrière garde profondeur','Côté faible disponible après renversement'],pivot:['Pivot déplace au moins un central','Passe intérieure seulement si fenêtre claire','Intervalle extérieur créé même sans réception'],overload:['Deux défenseurs attirés sur une même menace','Joueur libre reçoit lancé','Finition sans précipitation'],placed:['Déclenchement synchronisé','Option 2 disponible si option 1 fermée','Le lancement crée une vraie décision défensive']};return m[s]||['Comportement cible observable','Rythme proche du match','Réussite transférable en opposition libre'];}

function objectiveFor(c,t){
  if(c==='Baby Hand') return 'Développer motricité, manipulation du ballon, repères dans l’espace et plaisir de jouer à travers une histoire simple.';
  if(t.includes('arrière-pivot')) return 'Créer un intervalle puis utiliser le pivot pour déséquilibrer la défense 6-0.';
  const m={
    'Activation':'Préparer le corps et remettre immédiatement le ballon au centre de la séance.',
    'Passe / réception':'Améliorer la qualité de circulation et la menace avant transmission.',
    'Duel':'Créer un avantage individuel puis le transformer en avantage collectif.',
    'Tir':'Améliorer la finition dans un contexte proche du match.',
    'Gardien':'Développer lecture, déplacement et replacement du gardien.',
    'Montée de balle':'Gagner du temps et de l’espace dès la récupération.',

function themeFilteredOptions(opts,cat,theme){
  const all=opts.slice();let needles=[];
  if(cat==='Tactique défensive'){
    if(theme.includes('0-6')||theme.includes('6-0'))needles=['0-6','6-0'];
    else if(theme.includes('1-5')||theme.includes('5-1'))needles=['1-5','5-1'];
    else if(theme.includes('2-4')||theme.includes('4-2'))needles=['2-4','4-2'];
    else if(theme.includes('3-2-1'))needles=['3-2-1'];
    else if(theme.includes('1-2-3'))needles=['1-2-3'];
  }
  if(cat==='Situations spéciales'){
    if(theme.includes('7c6')||theme.includes('7v6')||theme.includes('but vide'))needles=['7c6','but vide'];
    else if(theme.includes('6c5')||theme.includes('supérior'))needles=['6c5','supériorité'];
    else if(theme.includes('5c6')||theme.includes('inférior'))needles=['5c6','infériorité'];
    else if(theme.includes('fin de match')){if(/-\s*2|retard|remonter/.test(theme))needles=['-2'];else if(/\+\s*1|avance|protéger|proteger/.test(theme))needles=['+1'];else needles=['fin match'];}
  }
  if(!needles.length)return all;
  const matched=all.filter(e=>needles.some(n=>`${e.title} ${e.keywords}`.toLowerCase().includes(n)));
  return matched.length?matched:all;
}

function normalizeWords(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9+\-]+/g,' ').trim().split(/\s+/).filter(x=>x.length>2)}
function recentExerciseIds(){const ids=[];for(const s of safeJSON('chi_sessions',[]).slice(0,6)){for(const it of (s.items||[]))if(it.id)ids.push(it.id)}return new Set(ids)}
function exerciseThemeScore(e,theme,cat,index=0){
  const q=normalizeWords(theme),hay=normalizeWords(`${e.title} ${e.keywords} ${e.category}`),set=new Set(hay);let score=0;
  q.forEach(w=>{if(set.has(w))score+=4;else if(hay.some(x=>x.includes(w)||w.includes(x)))score+=1});
  const t=String(theme).toLowerCase();
  const sys=[['0-6','d60'],['6-0','d60'],['1-5','d51'],['5-1','d51'],['2-4','d42'],['4-2','d42'],['3-2-1','d321'],['1-2-3','d123']];for(const [k,s] of sys)if(t.includes(k)&&e.scheme===s)score+=12;
  if(/défend|defend|notre défense|notre defense/.test(t)&&e.category==='Tactique défensive')score+=14;
  if(/attaqu|contre/.test(t)&&e.category.startsWith('Défense '))score+=7;
  if(t.includes('gardien')&&/gardien/.test(e.category.toLowerCase()))score+=12;
  if(t.includes('ailier')&&e.category==='Spécifique ailier')score+=12;
  if((t.includes('arrière')||t.includes('arriere'))&&e.category==='Spécifique arrière')score+=12;
  if(t.includes('demi-centre')&&e.category==='Spécifique demi-centre')score+=12;
  if(t.includes('pivot')&&(e.category==='Spécifique pivot'||e.category==='Jeu avec pivot'))score+=10;
  if(t.includes('tir')&&['Tir','Spécifique ailier','Spécifique arrière','Gardien','Spécifique gardien'].includes(e.category))score+=6;
  if(t.includes('7c6')&&String(e.keywords).includes('7c6'))score+=14;
  if(t.includes('6c5')&&String(e.keywords).includes('6c5'))score+=14;
  if(t.includes('5c6')&&String(e.keywords).includes('5c6'))score+=14;
  if(recentExerciseIds().has(e.id))score-=5;
  score+=Math.max(0,3-index*.2);return score;
}
function sessionReason(e,theme,index){const t=String(theme).toLowerCase();if(e.category==='Activation')return 'Prépare les appuis, la prise d’information et le ballon avant le thème principal.';if(e.category==='Passe / réception')return 'Installe la qualité de fixation et de transmission nécessaire avant d’ajouter l’opposition.';if(e.category==='Tactique défensive')return `Travaille directement les responsabilités du système demandé (${schemeName(e.scheme)}) avant le réinvestissement collectif.`;if(e.category.startsWith('Défense '))return `Met l’attaque face au système réellement demandé (${schemeName(e.scheme)}) et oblige à créer un tir après l’avantage.`;if(e.category==='Jeu avec pivot')return 'Ajoute la relation intérieure et les réactions des défenseurs centraux avant le jeu global.';if(e.category==='Lancements de jeu')return 'Donne un déclencheur collectif, mais l’animation conserve une lecture et une vraie finition.';if(e.category.includes('Spécifique'))return `Isole le comportement du poste ${e.category.replace('Spécifique ','')} avant son transfert au collectif.`;if(e.category==='Situations spéciales')return 'Reproduit le contexte numérique ou temporel précis avant de le laisser vivre en opposition.';return e.why||'Cette situation prépare le comportement attendu dans la suite de la séance.'}
function toSessionItem(e,i,theme=''){return {title:e.title,duration:e.duration,category:e.category,intensity:i<2?'Moyenne':i>4?'Forte':'Moyenne',id:e.id,why:sessionReason(e,theme,i)};}
function fitSession(items,target){
  const total=items.reduce((a,b)=>a+b.duration,0); if(!total||total===target)return items;
  const ratio=target/total;
  let out=items.map((x,i)=>({...x,duration:Math.max(i===items.length-1?5:7,Math.round(x.duration*ratio))}));
  let delta=target-out.reduce((a,b)=>a+b.duration,0), guard=0;
  while(delta!==0 && guard++<500){
    let changed=false;
    for(let i=0;i<out.length && delta!==0;i++){
      const min=i===out.length-1?5:7;
      if(delta>0){out[i].duration+=1;delta-=1;changed=true}
      else if(out[i].duration>min){out[i].duration-=1;delta+=1;changed=true}
    }
    if(!changed)break;
  }
  return out;
}
function hashCode(str){let h=0;for(let i=0;i<str.length;i++)h=((h<<5)-h)+str.charCodeAt(i)|0;return Math.abs(h);}

  {id:'def-switch',cat:'Défense',phase:'Adaptation',title:'Quand changer de défense ?',summary:'Changer de système doit répondre à un problème identifié, pas à une impression vague.',why:'Un changement défensif peut casser le rythme adverse mais peut aussi désorganiser ta propre équipe.',points:['Identifier le problème exact : tir extérieur, pivot, demi-centre, jeu d’aile, rythme.','Choisir le système qui réduit ce problème.','Préparer les règles de transition entre systèmes.','Donner 1 ou 2 consignes prioritaires seulement.'],watch:['Changer après chaque but encaissé.','Choisir une défense non travaillée.','Multiplier les informations pendant le temps mort.'],match:'Changer si le système actuel laisse toujours le même avantage et si la nouvelle organisation a été préparée.'},

  {id:'longshot-def',cat:'Défense',phase:'Tir extérieur',title:'Limiter un tireur de loin',summary:'Il faut réduire son confort avant le tir plutôt que simplement demander au gardien de faire plus d’arrêts.',why:'Le tir extérieur devient dangereux quand le tireur reçoit lancé et sans pression.',points:['Sortie plus précoce du défenseur concerné.','Dissuasion sur la passe de déclenchement.','Aide du voisin sur la course intérieure.','Coordination avec le gardien sur zones de tir.'],watch:['Sortie trop tardive.','Défenseur qui saute sur la feinte.','Ouverture du pivot sans couverture.'],match:'Si un arrière prend feu, casser sa prise de vitesse peut être plus efficace que changer toute la défense.'},
  {id:'attack60',cat:'Attaque',phase:'Contre 0-6',title:'Attaquer une 0-6',summary:'Créer du désalignement dans une ligne compacte par fixation, jeu sans ballon, pivot et renversements.',why:'Une 0-6 devient forte si l’attaque se contente de circuler autour.',points:['Menacer les intervalles.','Faire déplacer les centraux.','Utiliser le pivot comme créateur d’espace.','Renverser après avoir attiré la défense.'],watch:['Passes latérales sans menace.','Tirs forcés à 10 m.','Pivot statique.'],match:'Si la 0-6 ne bouge pas, augmenter la menace et les changements de secteur avant d’ajouter une combinaison complexe.'},
  {id:'attack51',cat:'Attaque',phase:'Contre 1-5',title:'Attaquer une 1-5',summary:'Faire choisir l’avancé, jouer dans son dos et déplacer rapidement la ligne basse.',why:'L’espace clé se situe souvent derrière ou à côté de l’avancé.',points:['Attirer l’avancé sans dribble inutile.','Occuper son dos.','Utiliser un pivot ou une entrée de joueur.','Renverser dès que la ligne basse coulisse trop.'],watch:['DC qui subit l’avancé.','Attaquants alignés devant la défense.','Trop de dribbles.'],match:'Si l’avancé domine ton DC, crée une relation à deux ou retire momentanément le DC de sa zone habituelle.'},
  {id:'attack42',cat:'Attaque',phase:'Contre 2-4',title:'Attaquer une 2-4',summary:'Profiter des espaces derrière les deux avancés et obliger les quatre bas à couvrir beaucoup de largeur.',why:'Une 2-4 cherche à accélérer tes décisions : il faut jouer derrière la première ligne sans précipitation.',points:['Passes courtes dans le dos des avancés.','Pivot mobile entre les quatre bas.','Ailes larges.','Renversement après fixation d’un avancé.'],watch:['Jeu frontal contre les avancés.','Passe risquée longue distance.','Manque de soutien derrière le porteur.'],match:'Si les avancés sont très agressifs, le jeu sans ballon dans leur dos devient prioritaire.'},
  {id:'attack321',cat:'Attaque',phase:'Contre 3-2-1',title:'Attaquer une 3-2-1',summary:'Fixer la pointe, occuper son dos et obliger les intermédiaires à choisir.',why:'La 3-2-1 vit de l’incertitude : l’attaque doit simplifier ses lectures.',points:['Fixer la pointe sans rester face à elle.','Jouer vite entre les lignes.','Faire bouger le pivot.','Garder la largeur pour étirer les trois bas.'],watch:['Dribble face à la pointe.','Base arrière immobile.','Ailes trop proches du centre.'],match:'Si la pointe te gêne, utilise son dos et des courses croisées plutôt que de chercher à la battre à chaque possession.'},
  {id:'attack123',cat:'Attaque',phase:'Contre 1-2-3',title:'Attaquer une 1-2-3',summary:'Attirer les trois joueurs hauts, occuper les espaces entre les lignes puis jouer avant la reformation.',why:'Une 1-2-3 devient très forte si l’attaque reste devant sa première ligne et joue à plat.',points:['Fixer un joueur haut avant de jouer dans son dos.','Installer au moins une solution entre les lignes.','Faire bouger le pivot derrière les deux intermédiaires.','Renverser rapidement dès que les trois hauts se resserrent.'],watch:['Dribble statique face aux trois hauts.','Aucun appui entre les lignes.','Passe longue forcée au pivot.','Renversement après arrêt de balle.'],match:'Si les trois hauts gagnent tous les duels de prise de balle, change les hauteurs et utilise davantage les courses sans ballon entre les lignes.'},
  {id:'attack-mixed',cat:'Attaque',phase:'Contre mixte / stricte',title:'Attaquer une défense mixte ou une prise stricte',summary:'Libérer le joueur ciblé sans bloquer les cinq autres et exploiter les espaces créés par la prise individuelle.',why:'Une stricte retire un joueur mais crée aussi du 5c5 et des espaces inhabituels ailleurs.',points:['Identifier qui est pris et pourquoi.','Utiliser écrans, permutations ou changements de poste sans figer le jeu.','Exploiter rapidement le 5c5 côté ballon.','Éviter que le joueur pris attire tout le collectif loin du but.'],watch:['Forcer toutes les balles vers le joueur pris.','Cinq joueurs immobiles qui attendent sa libération.','Écran sans continuité derrière.'],match:'Si la stricte réussit, le premier objectif n’est pas forcément de libérer le joueur ciblé : punis d’abord l’espace qu’elle crée.'},
  {id:'finish-quality',cat:'Attaque',phase:'Finition',title:'Transformer l’avantage en vrai tir',summary:'Une action tactique n’est pas terminée quand la passe arrive : le dernier porteur doit prendre ses appuis, lire le gardien et conclure ou continuer.',why:'Une combinaison peut être parfaitement exécutée et pourtant ne créer aucun tir de qualité.',points:['Identifier clairement le dernier porteur.','Montrer sa prise d’appuis et sa montée au tir.','Conserver une continuité si le tir est fermé.','Intégrer la position du gardien à la décision.'],watch:['Animation qui s’arrête après une passe.','Tir symbolique sans gardien.','Porteur final déjà arrêté.','Tir forcé alors que l’aide a fermé la fenêtre.'],match:'Évalue la qualité du tir obtenu, pas seulement la réussite du lancement.'},
  {id:'shot-read-gk',cat:'Attaque',phase:'Tir / gardien',title:'Lire le gardien au moment de finir',summary:'Le tireur doit garder plusieurs possibilités jusqu’au déclenchement plutôt que décider sa zone trop tôt.',why:'Un gardien performant gagne beaucoup de duels lorsque le tireur devient prévisible avant son dernier appui.',points:['Arriver équilibré.','Voir placement et déplacement du gardien.','Armer tard.','Adapter trajectoire, hauteur et timing.'],watch:['Regarder uniquement le ballon.','Décider la zone avant l’appel.','Perdre l’équilibre pour chercher un effet.'],match:'Si un gardien adverse domine, cherche d’abord de meilleurs angles et des tirs plus équilibrés avant de multiplier les consignes de zone.'},
  {id:'trans-1',cat:'Transition',phase:'Repli',title:'Changement de statut : perte → repli',summary:'La priorité n’est pas de récupérer tout de suite mais d’empêcher le but facile et retrouver une organisation.',why:'Les premières secondes après perte décident souvent de la qualité du repli.',points:['Réaction immédiate.','Protéger l’axe.','Freiner le porteur.','Se répartir avant d’arriver à 6 m.'],watch:['Joueurs qui protestent ou regardent.','Tout le monde court vers le ballon.','Axe laissé vide.'],match:'Si tu prends trop de buts rapides, compte d’abord combien de joueurs protègent l’axe dans les 3 premières secondes.'},
  {id:'trans-2',cat:'Transition',phase:'Montée de balle',title:'Récupération → première vague',summary:'La récupération devient une opportunité si la première décision est rapide et claire.',why:'Une défense replacée est plus difficile à attaquer qu’une équipe encore en transition.',points:['Gardien ou récupérateur lève la tête.','Ailes partent dans les couloirs.','Première passe vers l’avant.','Deuxième vague garde de la profondeur.'],watch:['Relance systématique sans lecture.','Tous les joueurs demandent la balle au même niveau.','Contre-attaque poursuivie malgré l’absence d’avantage.'],match:'Si la montée de balle devient stérile, autoriser l’équipe à stopper et passer en attaque placée plus tôt.'},
  {id:'7v6',cat:'Situations spéciales',phase:'7c6',title:'Attaquer à 7 contre 6',summary:'Le 7c6 crée un surnombre mais expose immédiatement le but vide à la perte de balle.',why:'Le bénéfice dépend autant de la qualité des choix offensifs que de la gestion de la transition.',points:['Organisation claire à deux pivots ou autre structure choisie.','Passes sûres avant tout.','Définir qui protège la perte.','Changement gardien-joueur travaillé.'],watch:['Surnombre joué trop vite.','Passe risquée dans l’axe.','Aucun joueur prêt à réagir à la perte.'],match:'À utiliser si tu maîtrises les changements et si le bénéfice offensif dépasse le risque de but vide.'},
  {id:'6v5',cat:'Situations spéciales',phase:'Supériorité',title:'Attaquer en supériorité 6c5',summary:'Écarter la défense, déplacer le bloc et finir après avoir créé un vrai joueur libre.',why:'La supériorité ne garantit rien si le ballon circule sans fixation.',points:['Largeur maximale.','Une fixation avant chaque passe de décalage.','Chercher le joueur libre, pas le tir rapide.','Pivot mobile pour fixer deux défenseurs.'],watch:['Précipitation.','Tir extérieur contesté en supériorité.','Aile oubliée.'],match:'En supériorité, la patience utile vaut souvent plus qu’un système compliqué.'},
  {id:'5v6',cat:'Situations spéciales',phase:'Infériorité',title:'Attaquer en infériorité 5c6',summary:'Préserver la balle, créer des duels choisis et limiter les pertes qui déclenchent une contre-attaque.',why:'Le but n’est pas forcément de marquer vite mais de rester dangereux tout en gérant le temps.',points:['Espacer sans isoler le porteur.','Choisir un duel favorable.','Limiter les passes à risque.','Préparer le repli.'],watch:['Vouloir compenser par une action individuelle forcée.','Passes longues latérales.','Aucun équilibre à la perte.'],match:'Selon le score et le temps, une possession longue peut être une excellente décision.'},
  {id:'timeout',cat:'Match',phase:'Temps mort',title:'Faire un temps mort utile',summary:'Un bon temps mort donne peu d’informations mais change immédiatement un comportement observable.',why:'Les joueurs retiennent mal une liste de six corrections sous stress.',points:['Nommer le problème exact.','Donner une priorité offensive et une défensive maximum.','Prévoir la première action de reprise.','Finir par une consigne simple de confiance.'],watch:['Discours trop long.','Ajouter un système jamais travaillé.','Parler de tout sauf du problème principal.'],match:'Si tu ne peux pas résumer ta correction en une phrase, elle est probablement trop complexe pour le temps mort.'},
  {id:'endgame-lead',cat:'Match',phase:'Fin de match',title:'Protéger une avance',summary:'Gérer le tempo sans devenir passif et éviter les pertes de balle gratuites.',why:'Ralentir ne veut pas dire arrêter d’attaquer.',points:['Garder une menace vers le but.','Choisir des possessions longues mais actives.','Sécuriser le repli.','Connaître les joueurs à qui confier la décision.'],watch:['Arrêter complètement de jouer.','Tir trop tôt.','Passe risquée parce que la défense presse.'],match:'Avec une avance, la valeur d’une possession peut devenir plus importante que la recherche du but immédiat.'},
  {id:'endgame-chase',cat:'Match',phase:'Fin de match',title:'Revenir au score',summary:'Augmenter le nombre de possessions sans perdre toute structure.',why:'La précipitation réduit souvent les chances de revenir.',points:['Accélérer la remise en jeu.','Choisir une défense plus agressive si nécessaire.','Définir les tireurs prioritaires.','Savoir quand utiliser 7c6 ou prise individuelle.'],watch:['Tirs désespérés à 12 m.','Faute défensive trop tardive.','Temps mort gardé trop longtemps.'],match:'Chercher plus de possessions, pas seulement des tirs plus rapides.'},
  {id:'observe-1',cat:'Match',phase:'Observation',title:'Les 10 premières minutes : quoi regarder ?',summary:'Au lieu de tout noter, identifier quelques tendances qui peuvent guider les adaptations.',why:'Le début du match donne des informations sur les choix adverses et les rapports de force.',points:['D’où viennent leurs tirs ?','Qui organise réellement ?','Comment défendent-ils le pivot ?','Quel joueur est ciblé défensivement ?','Comment leur gardien réagit par zone ?'],watch:['Changer trop tôt sur un échantillon de deux actions.','Confondre résultat et tendance.'],match:'Cherche des répétitions : même zone, même relation, même joueur impliqué.'},
  {id:'observe-2',cat:'Match',phase:'Observation',title:'Lire le gardien adverse',summary:'Observer ses préférences sans transformer chaque tir en duel théorique.',why:'Le gardien donne parfois des tendances exploitables, mais le tireur doit conserver sa capacité d’adaptation.',points:['Position de départ.','Réaction sur tirs d’aile.','Tendance haut/bas.','Sorties sur duel à 6 m.','Comportement après plusieurs tirs similaires.'],watch:['Donner une consigne rigide à tous les tireurs.','Surinterpréter deux arrêts.'],match:'Donner une tendance, pas une obligation : “il ferme tôt le premier poteau”, pas “tirez tous au second”.'},
  {id:'observe-3',cat:'Match',phase:'Observation',title:'Identifier un mismatch',summary:'Repérer une relation attaquant-défenseur ou défenseur-attaquant nettement favorable.',why:'Un avantage individuel répété peut structurer tout le plan de jeu.',points:['Vitesse vs puissance.','Droitier/gaucher et angle de duel.','Défenseur déjà sanctionné.','Fatigue ou difficulté de replacement.'],watch:['Forcer le même duel même après adaptation adverse.','Oublier le côté faible.'],match:'Exploiter le mismatch, puis regarder comment l’adversaire aide : c’est souvent là que naît le deuxième avantage.'},
  {id:'subs',cat:'Match',phase:'Gestion',title:'Gérer les rotations',summary:'Les changements doivent préserver les équilibres et pas seulement répartir le temps de jeu.',why:'Une rotation peut modifier défense, vitesse de transition et qualité du jeu placé.',points:['Identifier les associations efficaces.','Éviter trop de changements simultanés.','Prévoir les joueurs de fin de match.','Anticiper les exclusions temporaires.'],watch:['Changer uniquement après une erreur.','Casser une dynamique positive.','Oublier les besoins défensifs du prochain passage.'],match:'La question n’est pas seulement “qui est frais ?” mais “de quoi l’équipe a besoin maintenant ?”.'},
  {id:'tempo',cat:'Match',phase:'Gestion',title:'Gérer le tempo du match',summary:'Accélérer ou ralentir selon l’état du match, sans perdre les principes de jeu.',why:'Le tempo peut empêcher l’adversaire d’installer son rythme préféré.',points:['Accélérer après récupération.','Ralentir si l’équipe perd le contrôle.','Alterner jeu rapide et attaque longue.','Adapter selon score et fatigue.'],watch:['Jouer toujours au même rythme.','Confondre vitesse et précipitation.'],match:'Si ton équipe s’emballe, la première correction peut être le tempo, pas la tactique.'},
  {id:'sanctions',cat:'Match',phase:'Discipline',title:'Jouer avec les exclusions temporaires',summary:'Chaque 2 minutes modifie le rapport risque/bénéfice des choix offensifs et défensifs.',why:'Une équipe peut perdre beaucoup plus que deux minutes si elle gère mal ces phases.',points:['Plan clair en 5c6 et 6c5.','Protéger le joueur déjà averti ou sanctionné.','Adapter l’agressivité défensive.','Connaître la première option offensive en supériorité.'],watch:['Improviser à chaque exclusion.','Chercher le but trop vite à 6c5.'],match:'Les phases numériques doivent être préparées comme de vraies situations de jeu, pas comme des exceptions.'},
  {id:'press-end',cat:'Match',phase:'Défense agressive',title:'Passer en défense tout terrain / prise individuelle',summary:'Augmenter la pression quand le temps devient plus important que la protection de l’espace.',why:'En fin de match, laisser l’adversaire consommer le temps peut être pire que concéder un duel.',points:['Définir qui prend qui.','Fermer les premières passes faciles.','Accepter le risque de duel.','Préparer la récupération et la relance.'],watch:['Déclencher trop tôt.','Deux défenseurs sur le même joueur.','Faute inutile loin du ballon.'],match:'C’est un outil de récupération de possessions, pas une défense à choisir uniquement par frustration.'}
];

function theoryCategories(){return ['Tous',...new Set(tacticalTheory.map(x=>x.cat))]}
function theoryCard(t){const cls=t.cat==='Attaque'?'attack':t.cat==='Défense'?'defense':t.cat==='Transition'?'transition':'';return `<article class="card theory-card" data-theory="${t.id}"><span class="theory-chip ${cls}">${t.cat}</span><span class="theory-chip">${t.phase}</span><h3>${t.title}</h3><p>${t.summary}</p></article>`}

async function createCoachCloud(){

function exercisePositions(e){
  const txt=`${e.title} ${e.category} ${e.keywords||''}`.toLowerCase(),out=[];
  const token=w=>new RegExp(`(^|[\s,(/-])${w}(?=$|[\s,)/-])`,'i').test(txt);
  if(e.category==='Baby Hand')return ['Baby'];
  if(e.category==='Spécifique gardien'||e.category==='Gardien')return ['Gardien'];
  if(e.category==='Spécifique ailier')return ['Ailier'];
  if(e.category==='Spécifique arrière')return ['Arrière'];
  if(e.category==='Spécifique demi-centre')return ['Demi-centre'];
  if(e.category==='Spécifique pivot')return ['Pivot'];
  if(txt.includes('gardien'))out.push('Gardien');
  if(txt.includes('ailier'))out.push('Ailier');
  if(txt.includes('arrière')||txt.includes('arriere')||token('arg')||token('ard'))out.push('Arrière');
  if(txt.includes('demi-centre')||txt.includes('demi centre')||token('dc'))out.push('Demi-centre');
  if(e.category==='Jeu avec pivot'||txt.includes('pivot'))out.push('Pivot');
  const collective=['Activation','Passe / réception','Duel','Montée de balle','Repli défensif','Jeu placé','Tactique défensive','Changement de statut','Situations spéciales','Surnombre','Défense 6-0','Défense 5-1','Défense 1-2-3','Défense 3-2-1','Défense 4-2','Lancements de jeu','Jeu avec pivot'];
  if(!out.length||collective.includes(e.category))out.push('Collectif');
  return [...new Set(out)]
}

function exerciseFinality(e){
  const id=String(e?.id||''),cat=String(e?.category||''),txt=`${e?.title||''} ${e?.keywords||''}`.toLowerCase();
  if(cat==='Tactique défensive') return {type:'defense',label:'Stop / récupération',detail:'La séquence se termine par une réponse défensive lisible, pas par un tir artificiel.'};
  if(cat==='Repli défensif'||id==='status-1'||id==='status-3'||id==='special-end-2') return {type:'defense',label:'Stabiliser / récupérer',detail:'La finalité est la protection du but, le freinage puis la récupération de l’organisation.'};
  if(cat==='Activation'||cat==='Passe / réception') return {type:'continuity',label:'Continuité',detail:'Pas de tir imposé : la qualité recherchée est la circulation, les appuis et la disponibilité.'};
  if(cat==='Baby Hand'){
    if(/mini-match|viser|lancer|château|fusée|étoile|volcan/.test(txt)) return {type:'target',label:'Atteindre la cible',detail:'Finalité ludique adaptée au Baby Hand, sans gardien adulte artificiel.'};
    return {type:'continuity',label:'Motricité / coopération',detail:'La réussite vient du déplacement, de la manipulation ou de la coopération.'};
  }
  if(cat==='Gardien'||cat==='Spécifique gardien') return {type:'save',label:'Tir + parade',detail:'Le tireur termine réellement au but et le gardien est visible dans sa lecture et sa parade.'};
  if(id==='special-emptygoal-1') return {type:'continuity',label:'Changement sécurisé',detail:'La priorité est le changement gardien-joueur sans perte de balle.'};
  if(id==='special-5v6-1') return {type:'shot',label:'Tir sélectionné',detail:'À cinq, la séquence ne se termine que si une vraie fenêtre de tir est créée.'};
  return {type:'shot',label:'Prise d’appuis + tir',detail:'Le dernier porteur monte réellement au tir face au gardien.'};
}

function boardCoords(ev,el,pad=0){const r=el.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*100,y=(ev.clientY-r.top)/r.height*100;return {x:Math.max(pad,Math.min(100-pad,x)),y:Math.max(pad,Math.min(100-pad,y))}}
function refreshFreeBoardDOM(){const holder=document.querySelector('#freeBoardShell');if(holder)holder.outerHTML=renderFreeBoardCourt();bindFreeBoardInteractions();}

function animateBoardSnapshot(s,index){const b=getFreeBoard(),board=document.querySelector('#freeBoard');if(!board)return;if((s.mode||b.mode)!==b.mode){b.mode=s.mode||b.mode;loadBoardSnapshot(s);return}b.players=cloneBoardData(s.players);b.ball=cloneBoardData(s.ball);b.arrows=cloneBoardData(s.arrows);b.preset=s.preset||b.preset;b.currentStep=index;b.players.forEach(p=>{const n=board.querySelector(`[data-board-player="${p.id}"]`);if(n){n.style.left=p.x+'%';n.style.top=p.y+'%'}});const ball=board.querySelector('[data-board-ball]');if(ball){ball.style.left=b.ball.x+'%';ball.style.top=b.ball.y+'%'}const arrows=board.querySelector('.free-board-arrows');if(arrows){arrows.innerHTML=b.arrows.map((a,i)=>lineArrow(a.x1,a.y1,a.x2,a.y2,a.type,true,'fb'+i)).join('')}const label=board.querySelector('#boardSequenceLabel');if(label){label.hidden=false;label.textContent=`${index+1}/${b.steps.length} · ${s.name||'Étape'}`}document.querySelectorAll('[data-board-step]').forEach((x,j)=>x.classList.toggle('active',j===index));persistFreeBoard();}
function stopBoardSequence(){if(boardSequenceTimer){clearInterval(boardSequenceTimer);boardSequenceTimer=null}const board=document.querySelector('#freeBoard');board?.classList.remove('sequence-playing');const label=document.querySelector('#boardSequenceLabel');if(label)label.hidden=true;const btn=document.querySelector('#boardPlaySteps');if(btn)btn.textContent='▶ Lire la séquence'}

function bindFreeBoardInteractions(){const board=document.querySelector('#freeBoard');if(!board)return;const b=getFreeBoard();
  document.querySelectorAll('[data-board-player]').forEach(node=>node.onpointerdown=ev=>{if(b.tool!=='move')return;ev.preventDefault();const id=node.dataset.boardPlayer;const move=mv=>{const c=boardCoords(mv,board,4),p=b.players.find(x=>x.id===id);if(p){p.x=c.x;p.y=c.y;node.style.left=c.x+'%';node.style.top=c.y+'%';persistFreeBoard()}};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)});
  const ball=document.querySelector('[data-board-ball]');if(ball)ball.onpointerdown=ev=>{if(b.tool!=='move')return;ev.preventDefault();const move=mv=>{const c=boardCoords(mv,board,2);b.ball=c;ball.style.left=c.x+'%';ball.style.top=c.y+'%';persistFreeBoard()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)};
  board.onpointerdown=ev=>{if(b.tool==='move')return;if(ev.target.closest('.free-board-player,[data-board-ball]'))ev.preventDefault();const start=boardCoords(ev,board);let preview=null;const move=mv=>{const end=boardCoords(mv,board);if(preview)preview.remove();const temp=document.createElement('div');temp.innerHTML=lineArrow(start.x,start.y,end.x,end.y,b.tool,true,'preview');preview=temp.firstElementChild;preview.style.zIndex='20';board.appendChild(preview)};const up=uv=>{const end=boardCoords(uv,board);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);if(preview)preview.remove();if(Math.hypot(end.x-start.x,end.y-start.y)>3){b.arrows.push({x1:start.x,y1:start.y,x2:end.x,y2:end.y,type:b.tool});persistFreeBoard();refreshFreeBoardDOM()}};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)};
}

function benchContext(){return state.bench||{};}
function getBenchOptions(ctx){
  const sit=matchSituations.find(x=>x.id===ctx.situation)||matchSituations[0];
  let opts=(benchOptionMap[sit.id]||sit.options.map((x,i)=>({title:x,benefit:'Option cohérente avec le problème observé.',risk:sit.risk,exercise:['launch-1','tact-06-1','status-1'][i%3],theory:'proj-1'}))).map(x=>({...x,score:0}));
  const diff=(Number(ctx.ourScore)||0)-(Number(ctx.theirScore)||0); const min=Number(ctx.minute)||0;
  opts.forEach(o=>{
    const t=o.title.toLowerCase();
    if(ctx.ourExcl>ctx.theirExcl && /7c6|agress|prise individuelle/.test(t)) o.score-=3;
    if(ctx.theirExcl>ctx.ourExcl && /renversement|croisé|rapport de force|7c6/.test(t)) o.score+=2;
    if(min>=55 && diff<0 && /7c6|rapide|agress|prise|rapport de force/.test(t)) o.score+=5;
    if(min>=55 && diff>0 && /tempo|sécur|contrôle|sortie ciblée/.test(t)) o.score+=4;
    if(ctx.dynamic==='On subit' && /tempo|sécur|simple|ciblée/.test(t)) o.score+=2;
    if(ctx.dynamic==='On domine' && /renversement|croisé|agress|rapide/.test(t)) o.score+=1;
    if(ctx.oppDefense.includes('0-6') && /croisé|ailier|renversement/.test(t)) o.score+=3;
    if(ctx.oppDefense.includes('1-5') && /dos|renvers|pivot/.test(t)) o.score+=3;
  });
  return {sit,opts:opts.sort((a,b)=>b.score-a.score).slice(0,3),diff,min};
}
function benchSummary(ctx,data){
  const left=Math.max(0,60-(Number(ctx.minute)||0));
  const scoreTxt=data.diff===0?'score à égalité':data.diff>0?`+${data.diff} au score`:`${data.diff} au score`;
  const num=ctx.ourExcl===ctx.theirExcl?'égalité numérique':ctx.ourExcl>ctx.theirExcl?'infériorité numérique':'supériorité numérique';
  return `${scoreTxt}, ${Math.round(left)} min restantes environ, ${num}. Priorité actuelle : ${data.sit.label.toLowerCase()}.`;
}
function nextPossessions(ctx,data){
  const first=data.opts[0]; const diff=data.diff, min=data.min;
  const p1=first?first.title:'Retrouver un principe simple';
  const p2=min>=55&&diff<0?'Accélérer la remise en jeu mais conserver un tir sélectionné.':min>=55&&diff>0?'Allonger la possession sans perdre la menace.':'Observer la réaction adverse et conserver la continuité.';
  const p3=ctx.ourExcl>ctx.theirExcl?'Priorité repli et protection de l’axe à la perte.':ctx.theirExcl>ctx.ourExcl?'Profiter de la supériorité sans tirer trop tôt.':'Au changement de statut : première course vers l’axe, puis répartition.';
  return [p1,p2,p3];
}

function cycleWeek(c){const start=new Date(c.start||Date.now()),elapsed=Math.max(0,(new Date()-start)/(7*864e5));return Math.max(1,Math.min(Number(c.weeks||4),Math.floor(elapsed)+1))}
function cycleProgress(c){return Math.round(cycleWeek(c)/Math.max(1,Number(c.weeks||4))*100)}
function cycleStage(c){const r=cycleWeek(c)/Math.max(1,Number(c.weeks||4));return r<=.25?'Installer':r<=.5?'Stabiliser':r<=.75?'Opposer':'Transférer'}
function cycleStageHint(stage){return ({Installer:'Repères simples, faible complexité, beaucoup de réussite.',Stabiliser:'Répéter sous contraintes et augmenter les choix.',Opposer:'Ajouter de la pression, du duel et de l’incertitude.',Transférer:'Se rapprocher du match, libérer les décisions et valider.'})[stage]||''}
function cycleSessionTheme(c){const stage=cycleStage(c),focus=c.focus||'Tactique';const suffix=stage==='Installer'?'— repères et fondamentaux':stage==='Stabiliser'?'— continuité et variantes':stage==='Opposer'?'— opposition et lecture': '— transfert match';return `${c.title} ${suffix} · ${focus}`}
function playerSessionHistory(p){return safeJSON('chi_history',[]).filter(h=>(h.attendance||[]).includes(p.id))}
function playerSpecificTheme(p){const pos=(p.position||'').toLowerCase();if(pos.includes('gardien'))return 'Spécifique gardien : lecture, déplacement et relance';if(pos.includes('ailier'))return 'Spécifique ailier : course, angle et finition';if(pos.includes('demi'))return 'Spécifique demi-centre : lecture, tempo et fixation';if(pos.includes('pivot'))return 'Spécifique pivot : blocs, réception et création d’espace';if(pos.includes('arrière'))return 'Spécifique arrière : duel, tir et relation avec le pivot';return 'Développement individuel : technique et prise de décision'}
function nextMatchPlan(){return safeJSON('chi_match_plans',[]).filter(x=>x.date&&new Date(x.date)>=new Date(new Date().toDateString())).sort((a,b)=>new Date(a.date)-new Date(b.date))[0]||null}

<div class="season-stat-grid"><div class="season-stat"><small>Effectif</small><strong>${d.team.length}</strong><span class="mini-kpi">${available} disponibles</span></div><div class="season-stat"><small>Cycles</small><strong>${d.cycles.length}</strong><span class="mini-kpi">${d.cycles.filter(c=>cycleProgress(c)<100).length} actifs</span></div><div class="season-stat"><small>Séances faites</small><strong>${d.history.length}</strong><span class="mini-kpi">${mins} min terrain</span></div><div class="season-stat"><small>Charge cumulée</small><strong>${load}</strong><span class="mini-kpi">durée × RPE</span></div></div>

function renderPlayerDetail(){const team=safeJSON('chi_team',[]),p=team.find(x=>x.id===state.currentPlayerId)||team[0];if(!p)return `<button class="back" data-nav="season">‹</button><div class="season-empty">Aucun joueur sélectionné.</div>`;const hist=playerSessionHistory(p),mins=hist.reduce((a,h)=>a+Number(h.duration||0),0),load=hist.reduce((a,h)=>a+Number(h.duration||0)*Number(h.rpe||0),0),avg=hist.length?(hist.reduce((a,h)=>a+Number(h.rpe||0),0)/hist.length).toFixed(1):'—';const focuses=['Duel','Tir','Passe','Lecture','Défense','Transition','Physique','Confiance'];return `<button class="back" data-nav="season">‹</button><section class="section" style="margin-top:0"><div class="player-profile-hero"><div class="jersey">${esc(p.number||'—')}</div><div><span class="eyebrow">Profil joueur</span><h2 style="margin:5px 0">${esc(p.name)}</h2><p>${esc(p.position)} · ${esc(p.hand)} · ${esc(p.status||'Disponible')}</p></div></div><div class="profile-kpis"><div class="profile-kpi"><strong>${hist.length}</strong><small>séances suivies</small></div><div class="profile-kpi"><strong>${mins}</strong><small>minutes</small></div><div class="profile-kpi"><strong>${avg}</strong><small>RPE moyen</small></div><div class="profile-kpi"><strong>${load}</strong><small>charge cumulée</small></div></div><form id="playerProfileForm" class="card section"><div class="field"><label>Objectif individuel prioritaire</label><input name="objective" value="${esc(p.objective||'')}" placeholder="Ex. attaquer plus tôt l’intervalle 2-3" /></div><div class="field" style="margin-top:12px"><label>Points forts</label><input name="strengths" value="${esc(p.strengths||'')}" placeholder="Ex. vitesse, lecture du jeu, tir en appui" /></div><div class="field" style="margin-top:12px"><label>Axes de travail</label><div>${focuses.map(f=>`<button type="button" class="focus-chip ${(p.focus||[]).includes(f)?'active':''}" data-player-focus="${f}">${f}</button>`).join('')}</div></div><div class="field" style="margin-top:12px"><label>Notes coach</label><textarea name="notes" rows="5" placeholder="Repères, observations, progression…">${esc(p.notes||'')}</textarea></div><div class="mobile-sticky-actions"><button class="btn btn-primary" id="savePlayerProfile" type="submit">Enregistrer</button><button class="btn btn-ghost" type="button" id="playerSpecificSession">Créer séance spécifique</button></div></form>${hist.length?`<section class="section"><h2>Dernières séances suivies</h2>${hist.slice(0,5).map(h=>`<article class="card" style="margin-top:8px"><span class="tag">${fmtDate(h.date)}</span><span class="tag orange">RPE ${h.rpe}</span><h3>${esc(h.theme)}</h3><p class="muted">${h.duration} min · charge ${Number(h.duration||0)*Number(h.rpe||0)}</p></article>`).join('')}</section>`:''}</section>`}

function renderCyclesTab(cycles){return `<section class="section"><div class="section-head"><div><h2>Cycles de travail</h2><p class="muted">Le moteur fait évoluer la séance : installer → stabiliser → opposer → transférer.</p></div></div><form id="cycleForm" class="card form-grid"><div class="field wide"><label>Objectif du cycle</label><input name="title" required placeholder="Ex. Attaquer une 0-6 : fixation + pivot" /></div><div class="field"><label>Durée</label><select name="weeks">${[2,3,4,5,6,8].map(x=>`<option value="${x}">${x} semaines</option>`).join('')}</select></div><div class="field"><label>Séances / semaine</label><select name="sessionsPerWeek"><option>1</option><option selected>2</option><option>3</option></select></div><div class="field"><label>Début</label><input name="start" type="date" /></div><div class="field"><label>Catégorie</label><select name="category">${['U11','U13','U15','U18','Seniors'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Dominante</label><select name="focus"><option>Technique</option><option selected>Tactique</option><option>Transition</option><option>Postes spécifiques</option><option>Physique intégré</option></select></div><div class="field"><label>Match cible (facultatif)</label><input name="matchDate" type="date" /></div><div class="wide"><button class="btn btn-primary" style="width:100%">Créer le cycle</button></div></form><div class="grid grid-2 section">${cycles.length?cycles.map((c,i)=>{const prog=cycleProgress(c),stage=cycleStage(c),week=cycleWeek(c);return `<article class="card cycle-card"><span class="tag">${esc(c.category)}</span><span class="tag orange">${c.weeks} sem.</span><span class="cycle-stage">${stage}</span><h3>${esc(c.title)}</h3><div class="cycle-progress"><span style="width:${prog}%"></span></div><div class="cycle-meta-grid"><div class="cycle-meta"><strong>Semaine ${week}/${c.weeks}</strong><br>${esc(c.focus||'Tactique')}</div><div class="cycle-meta"><strong>${c.sessionsPerWeek||2}/sem.</strong><br>rythme prévu</div><div class="cycle-meta"><strong>${c.generated||0}</strong><br>séances créées</div><div class="cycle-meta"><strong>${c.completed||0}</strong><br>séances réalisées</div></div><p class="muted">${cycleStageHint(stage)}</p><p class="muted">Début ${fmtDate(c.start)}${c.matchDate?` · match cible ${fmtDate(c.matchDate)}`:''}</p><div class="compact-actions"><button class="btn btn-primary mini" data-cycle-session="${i}">Créer la prochaine séance</button><button class="btn btn-danger mini" data-cycle-delete="${i}">Supprimer</button></div></article>`}).join(''):'<div class="season-empty">Crée ton premier cycle : Coach Hand IA fera évoluer progressivement la complexité des séances.</div>'}</div></section>`}

n-card"><span class="tag">${fmtDate(m.date)}</span><span class="tag orange">${esc(m.oppDefense||'Inconnue')}</span><h3>${esc(m.opponent)}</h3><div class="match-plan-summary"><div><strong>Notre défense</strong>${esc(m.ourDefense||'—')}</div><div><strong>Plan A</strong>${esc(m.planA||'—')}</div><div><strong>Plan B</strong>${esc(m.planB||'—')}</div><div><strong>À cibler</strong>${esc(m.weaknesses||'—')}</div></div>${m.strengths?`<p><strong>Attention :</strong> ${esc(m.strengths)}</p>`:''}<div class="compact-actions"><button class="btn btn-primary mini" data-match-session="${i}">Créer séance prépa</button><button class="btn btn-ghost mini" data-match-bench="${i}">Charger dans Assistant match</button><button class="btn btn-secondary mini" data-match-print="${i}">Imprimer</button><button class="btn btn-danger mini" data-match-delete="${i}">×</button></div></article>`).join(''):'<div class="season-empty">Ajoute un adversaire : tu auras ensuite ton plan de match, une séance dédiée et un raccourci vers l’assistant de banc.</div>'}</div></section>`}

function createLiveSession(session){const s=JSON.parse(JSON.stringify(session||state.session||{}));if(!s?.items)return null;const team=safeJSON('chi_team',[]).filter(p=>p.status!=='Absent');return {id:'live-'+Date.now(),session:s,startedAt:null,elapsed:0,running:false,currentIndex:0,done:Array(s.items.length).fill(false),itemElapsed:Array(s.items.length).fill(0),itemStartedAt:null,itemNotes:Array(s.items.length).fill(''),attendance:team.map(p=>p.id),notes:'',rpe:6,rating:4,createdAt:Date.now()}}
function getLiveSession(){return safeJSON('chi_live_session',null)}
function saveLiveSession(l){if(l)localStorage.setItem('chi_live_session',JSON.stringify(l));else localStorage.removeItem('chi_live_session');scheduleCloudSync()}
function liveElapsed(l){return Number(l?.elapsed||0)+(l?.running&&l.startedAt?Date.now()-l.startedAt:0)}
function exerciseElapsed(l){const i=Number(l?.currentIndex||0),base=Number(l?.itemElapsed?.[i]||0);return base+(l?.running&&l.itemStartedAt?Date.now()-l.itemStartedAt:0)}
function commitCurrentExerciseTime(l){if(!l)return;if(!Array.isArray(l.itemElapsed))l.itemElapsed=Array((l.session?.items||[]).length).fill(0);if(l.running&&l.itemStartedAt){l.itemElapsed[l.currentIndex]=Number(l.itemElapsed[l.currentIndex]||0)+(Date.now()-l.itemStartedAt);l.itemStartedAt=Date.now()}}
function fmtClock(ms){const sec=Math.max(0,Math.floor(ms/1000)),m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function renderLiveSession(){const l=getLiveSession();if(l&&!state.session)state.session=l.session;if(!l)return `<button class="back" data-nav="home">‹</button><div class="season-empty">Aucune séance en cours. Ouvre une séance puis choisis « Lancer la séance ».</div>`;if(!Array.isArray(l.itemElapsed))l.itemElapsed=Array((l.session?.items||[]).length).fill(0);if(!Array.isArray(l.itemNotes))l.itemNotes=Array((l.session?.items||[]).length).fill('');if(!Array.isArray(l.attendance))l.attendance=safeJSON('chi_team',[]).filter(p=>p.status!=='Absent').map(p=>p.id);const s=l.session,idx=Math.min(l.currentIndex,(s.items||[]).length-1),cur=s.items[idx],exMs=exerciseElapsed(l),targetMs=Number(cur?.duration||0)*60000,exPct=targetMs?Math.min(100,Math.round(exMs/targetMs*100)):0,team=safeJSON('chi_team',[]);return `<button class="back" data-nav="session">‹</button><section class="section" style="margin-top:0"><div class="live-hero"><span class="eyebrow">Mode terrain</span><h2 style="font-size:28px;margin:8px 0">${esc(s.theme)}</h2><div class="live-clock" id="liveClock">${fmtClock(liveElapsed(l))}</div><p style="color:#dcecff;margin:0">${l.done.filter(Boolean).length}/${l.done.length} exercices terminés · ${esc(s.category)}</p><div class="compact-actions" style="margin-top:14px"><button class="btn btn-primary" id="liveToggle">${l.running?'❚❚ Pause':'▶ Démarrer'}</button><button class="btn btn-secondary" id="liveNext">Exercice suivant →</button></div></div>${cur?`<article class="card live-current live-focus-card section"><span class="tag orange">Exercice ${idx+1}/${s.items.length}</span><h2>${esc(cur.title)}</h2><p class="muted">${cur.duration} min · ${esc(cur.category)}</p><div class="exercise-timer-box"><div><div class="exercise-timer-label">Temps sur cet exercice</div><div class="exercise-timer" id="exerciseClock">${fmtClock(exMs)}</div><div class="exercise-progress"><span id="exerciseProgressBar" style="width:${exPct}%"></span></div></div><div><strong>${cur.duration}:00</strong> function problemResult(text){
  const low=text.toLowerCase(); let diag='L’équipe manque probablement de menace avant transmission : la défense n’a aucune raison de sortir ou de se désaligner.';
  let cycle=[['Séance 1','Attaquer l’intervalle avant de transmettre'],['Séance 2','2c2 / 3c3 : fixation et continuité'],['Séance 3','6c6 dirigé : distance de jeu et relation pivot']];
  if(low.includes('perte')||low.includes('ballon')){diag='Les pertes peuvent venir d’une circulation trop lente, d’angles de passe faibles ou d’un manque de solutions autour du porteur.';cycle=[['Séance 1','Passe sous pression et orientation'],['Séance 2','Montée de balle en supériorité'],['Séance 3','Jeu dirigé avec contrainte de conservation']];}
  if(low.includes('repli')){diag='Le problème semble d’abord collectif : priorité à l’axe, communication et répartition des courses de retour.';cycle=[['Séance 1','Repli 3 zones'],['Séance 2','Perte de balle + retour express'],['Séance 3','Match à thème transition']];}
  return `<article class="card problem-result" style="margin-top:14px"><h3>Diagnostic possible</h3><p>${diag}</p><h3>Mini-cycle proposé</h3><div class="cycle">${cycle.map((c,i)=>`<div class="cycle-item"><strong>${i+1}. ${c[0]}</strong><br><span class="muted">${c[1]}</span></div>`).join('')}</div></article>`;
}

function updateAnimationStep(next){

  if(currentDefs.length!==(d.def||[]).length||currentAtt.length!==(d.att||[]).length){render();return;}

  (d.att||[]).forEach((p,i)=>{const el=court.querySelector('#A'+i);if(el){el.style.left=p[0]+'%';el.style.top=p[1]+'%';el.textContent=p[2]||'';el.classList.remove('active')}});
  const gb=court.querySelector('#GB');if(gb&&d.gb){gb.style.left=d.gb[0]+'%';gb.style.top=d.gb[1]+'%';gb.classList.remove('active')}else if((!!gb)!=(!!d.gb)){render();return;}
  const ball=court.querySelector('.ball');if(ball&&d.ball){ball.style.left=d.ball[0]+'%';ball.style.top=d.ball[1]+'%';ball.classList.add('live')}
  const arrows=court.querySelector('.court-arrows');if(arrows){arrows.innerHTML=(d.arrows||[]).map((a,i)=>lineArrow(a[0],a[1],a[2],a[3],a[4]||'run',false,i)).join('');requestAnimationFrame(()=>{arrows.querySelectorAll('.arrow').forEach(el=>el.classList.add('show'))});}
  court.querySelectorAll('.takeoff-mark,.goal-target,.outcome-marker').forEach(x=>x.remove());
  if(d.takeoff)court.insertAdjacentHTML('beforeend',`<div class="takeoff-mark" style="left:${d.takeoff[0]}%;top:${d.takeoff[1]}%"></div>`);
  if(d.goalTarget)court.insertAdjacentHTML('beforeend',`<div class="goal-target" style="left:${d.goalTarget[0]}%;top:${d.goalTarget[1]}%"></div>`);

  const players=[...court.querySelectorAll('.player')];if(Number.isInteger(d.activeAttIndex)){const active=court.querySelector('#A'+d.activeAttIndex);players.forEach(p=>p.classList.toggle('active',p===active));}else if(ball&&players.length){let best=null,bestDist=1e9;players.forEach(p=>{const lx=parseFloat(p.style.left),ty=parseFloat(p.style.top);const dx=lx-d.ball[0],dy=ty-d.ball[1],dist=Math.hypot(dx,dy);if(dist<bestDist){bestDist=dist;best=p;}});players.forEach(p=>p.classList.toggle('active',p===best&&bestDist<12));}
  const st=animationCopy(e,next);$('#animObjective').textContent=st.objective;$('#animCons').innerHTML=st.cons.map(x=>`<li>${x}</li>`).join('');$('#animKey').textContent=st.key;$('#animStepTitle').textContent='Étape '+next;$('#animStepText').textContent=st.title;$('#animProgress').style.width=(next/count*100)+'%';$('#animFraction').textContent=next+'/'+count;$('#animCounter').textContent=next+'/'+count;$$('.step-dot').forEach(b=>b.classList.toggle('active',Number(b.dataset.step)===next));$$('.step-label').forEach((b,i)=>b.classList.toggle('active',i===next-1));
}

(function(){
  let deferredInstallPrompt = null;
  const bar = document.getElementById('pwaInstallBar');
  const btn = document.getElementById('pwaInstallBtn');
  const headerBtn = document.getElementById('installBtn');
  const close = document.getElementById('pwaInstallClose');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      
    });
  }

  const showInstall = () => {
    if (standalone || sessionStorage.getItem('chi_install_closed') === '1') return;
    bar?.classList.add('show');
    if (headerBtn) headerBtn.hidden = false;
  };

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstall();
  });

  if (isIOS && !standalone) {
    setTimeout(() => {
      if (bar) {
        const sub = bar.querySelector('.pwa-sub');
        if (sub) sub.textContent = 'Safari : Partager → Sur l’écran d’accueil';
        if (btn) btn.textContent = 'Comment faire ?';
        showInstall();
      }
    }, 900);
  }

  const launchInstall = async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch(e) {}
      deferredInstallPrompt = null;
      bar?.classList.remove('show');
      if (headerBtn) headerBtn.hidden = true;
      return;
    }
    if (isIOS) {
      alert('Sur iPhone/iPad : touchez Partager dans Safari, puis « Sur l’écran d’accueil ».');
    }
  };

  btn?.addEventListener('click', launchInstall);
  headerBtn?.addEventListener('click', launchInstall);

  close?.addEventListener('click', () => {
    sessionStorage.setItem('chi_install_closed','1');
    bar?.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    bar?.classList.remove('show');
    if (headerBtn) headerBtn.hidden = true;
  });
})();
