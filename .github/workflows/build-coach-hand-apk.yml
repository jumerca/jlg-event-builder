name: Build Coach Hand IA APK

on:
  push:
    branches: ["main"]
    paths:
      - "coach-hand-android/**"
      - ".github/workflows/build-coach-hand-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: coach-hand-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare final filename
        run: cp coach-hand-android/app/build/outputs/apk/debug/app-debug.apk Coach-Hand-IA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coach-Hand-IA-Android
          path: Coach-Hand-IA.apk
          if-no-files-found: error
