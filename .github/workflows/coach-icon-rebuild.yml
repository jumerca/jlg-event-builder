name: Rebuild Coach Hand 512 icon

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/coach-icon-rebuild.yml"]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild valid 512 PNG from valid 192 PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p='coach-hand-v2/icon-192.png'
          out='coach-hand-v2/icon-512.png'
          im=Image.open(p).convert('RGBA')
          if im.size != (192,192): raise SystemExit(f'Bad 192 size: {im.size}')
          im.resize((512,512), Image.Resampling.LANCZOS).save(out, 'PNG', optimize=True)
          chk=Image.open(out); chk.verify()
          chk=Image.open(out)
          if chk.size != (512,512): raise SystemExit(f'Bad 512 size: {chk.size}')
          print('512 PNG valid', chk.size)
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('coach-hand-v2/sw.js')
          s=p.read_text()
          s=s.replace("coach-hand-v2-pwa-20260909-2","coach-hand-v2-pwa-20260909-3")
          p.write_text(s)
          PY
      - name: Commit rebuilt icon
        run: |
          rm -f .github/workflows/coach-icon-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-hand-v2/icon-512.png coach-hand-v2/sw.js .github/workflows/coach-icon-rebuild.yml
          git commit -m "Rebuild valid Coach Hand 512 PWA icon"
          git push
