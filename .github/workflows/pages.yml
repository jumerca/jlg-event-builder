name: Deploy JLG Event Builder to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build and verify Coach Hand IA
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const cp = require('child_process');
          const p = 'coach-hand-ia';
          const read = f => fs.readFileSync(`${p}/${f}`, 'utf8').trim();
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');

          const cssB64 = read('cssz-1.txt') + read('cssz-2.txt');
          const css = zlib.gunzipSync(Buffer.from(cssB64, 'base64'));
          const cssHash = hash(css);
          if (cssHash !== '9e7b0d211fe78d89e41bda0f4fe83d5e169e32a0ba18cb8b7326c0c86fbbacb4') {
            throw new Error(`CSS integrity check failed: ${cssHash}`);
          }
          fs.writeFileSync(`${p}/app.css`, css);

          const jsB64 = read('fix-js1-a.txt') + read('fix-js1-b.txt')
                      + read('fix-js2-a.txt') + read('fix-js2-b.txt')
                      + read('jsz-3.txt') + read('jsz-4.txt') + read('jsz-5.txt')
                      + read('jsz-6.txt') + read('jsz-7.txt');
          const js = zlib.gunzipSync(Buffer.from(jsB64, 'base64'));
          const jsHash = hash(js);
          if (jsHash !== '1954ae5ad2f557693093183ce8dacdd33e57f855635ff6a64fbc6c850b9be990') {
            throw new Error(`JS integrity check failed: ${jsHash}`);
          }
          fs.writeFileSync(`${p}/app.js`, js);
          cp.execFileSync('node', ['--check', `${p}/app.js`], {stdio:'inherit'});

          fs.copyFileSync(`${p}/index-direct.html`, `${p}/index.html`);
          console.log(`Coach Hand IA verified: ${js.length} bytes JS / ${css.length} bytes CSS`);
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
