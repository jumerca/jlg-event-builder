name: Publish Coach Hand IA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "coach-hand-publish"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build verified Coach Hand IA
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const cp = require('child_process');
          const p = 'coach-hand-ia';
          const read = f => fs.readFileSync(`${p}/${f}`, 'utf8').trim();
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');

          const cssB64 = read('cssz-1.txt') + read('cssz-2.txt');
          const css = zlib.gunzipSync(Buffer.from(cssB64, 'base64'));
          if (hash(css) !== '9e7b0d211fe78d89e41bda0f4fe83d5e169e32a0ba18cb8b7326c0c86fbbacb4') throw new Error('CSS integrity check failed');

          const jsB64 = read('fix-js1-a.txt') + read('fix-js1-b.txt')
                      + read('fix-js2-a.txt') + read('fix-js2-b.txt')
                      + read('jsz-3.txt') + read('jsz-4.txt') + read('jsz-5.txt')
                      + read('jsz-6.txt') + read('jsz-7.txt');
          const js = zlib.gunzipSync(Buffer.from(jsB64, 'base64'));
          if (hash(js) !== '1954ae5ad2f557693093183ce8dacdd33e57f855635ff6a64fbc6c850b9be990') throw new Error('JS integrity check failed');
          cp.execFileSync('node', ['--check', '-'], {input: js, stdio:['pipe','inherit','inherit']});

          let html = fs.readFileSync(`${p}/index-direct.html`, 'utf8');
          const icon = 'data:image/svg+xml;base64,' + fs.readFileSync(`${p}/icon.svg`).toString('base64');
          let jsText = js.toString('utf8');
          jsText = jsText.replace("navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(() => {});", '');
          jsText = jsText.replace(/<\/script/gi, '<\\/script');
          const cssText = css.toString('utf8');

          html = html.replace('<link rel="stylesheet" href="./app.css" />', () => `<style>${cssText}</style>`);
          html = html.replace('<script src="./app.js"></script>', () => `<script>${jsText}</script>`);
          html = html.replaceAll('./icon.svg', () => icon);
          html = html.replace('  <link rel="manifest" href="./manifest.webmanifest" />\n', '');
          html = html.replace("      if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(console.warn));}\n", '');
          html = html.replace('</body>', `<script>(function(){try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.includes('/jlg-event-builder/'))r.unregister().catch(()=>{})}));}if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>k.includes('coach-hand')||k.includes('jlg-event-builder')).map(k=>caches.delete(k))));}}catch(e){}})();</script></body>`);

          if (!html.includes('const $$ = (s, r=document)')) throw new Error('Inline JS corruption detected');
          if (html.includes('navigator.serviceWorker.register')) throw new Error('Old service worker registration still present');
          if (html.includes('./app.js') || html.includes('./app.css') || html.includes('manifest.webmanifest')) throw new Error('Coach Hand v2 is not fully self-contained');
          if (crypto.createHash('sha256').update(html).digest('hex') !== 'a42e1e6ddeb958da6f01697913c76e256c637cfc7681adb58e16c39760ed34fd') throw new Error('Single-file HTML integrity check failed');

          fs.mkdirSync('coach-hand-v2', {recursive:true});
          fs.writeFileSync('coach-hand-v2/index.html', html);
          console.log(`Coach Hand v2 verified: ${Buffer.byteLength(html)} bytes`);
          NODE
      - name: Commit generated Coach Hand v2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-hand-v2/index.html
          if git diff --cached --quiet; then
            echo "Generated Coach Hand v2 already committed."
          else
            git commit -m "Publish generated Coach Hand v2"
            git push origin HEAD:main
          fi
