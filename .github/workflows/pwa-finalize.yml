name: Finalize Coach Hand PWA

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/pwa-finalize.yml"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Make Coach Hand a real installable PWA
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='coach-hand-v2/index.html';
          let h=fs.readFileSync(p,'utf8');

          // Always use the final Coach Hand icon in splash/header/install UI.
          h=h.replace(/data:image\/svg\+xml;base64,[A-Za-z0-9+/=]+/g,'./icon-512.png');

          // Remove the temporary migration code that deliberately unregistered service workers.
          const cleanup="<script>(function(){try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.includes('/jlg-event-builder/'))r.unregister().catch(()=>{})}));}if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>k.includes('coach-hand')||k.includes('jlg-event-builder')).map(k=>caches.delete(k))));}}catch(e){}})();</script>";
          h=h.replace(cleanup,'');

          const pwaHead=`  <link rel="manifest" href="./manifest.webmanifest?v=1" />
          <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
          <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
          <meta name="mobile-web-app-capable" content="yes" />
          <meta name="apple-mobile-web-app-capable" content="yes" />
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
          <meta name="apple-mobile-web-app-title" content="Coach Hand IA" />\n`;
          if(!h.includes('rel="manifest"')) h=h.replace('</head>',pwaHead+'</head>');

          const sw=`<script>\n(function(){\n  if(!('serviceWorker' in navigator) || location.protocol!=='https:') return;\n  window.addEventListener('load', async ()=>{\n    try{\n      const reg=await navigator.serviceWorker.register('./sw.js?v=1',{scope:'./'});\n      reg.update().catch(()=>{});\n    }catch(err){ console.warn('Coach Hand SW',err); }\n  });\n})();\n<\\/script>\n`;
          if(!h.includes("navigator.serviceWorker.register('./sw.js?v=1'")) h=h.replace('</body>',sw+'</body>');

          if(!h.includes('rel="manifest"')) throw new Error('Manifest link missing');
          if(!h.includes("register('./sw.js?v=1'")) throw new Error('SW registration missing');
          if(h.includes('serviceWorker.getRegistrations')) throw new Error('Old SW cleanup still present');
          if(!fs.existsSync('coach-hand-v2/icon-192.png') || !fs.existsSync('coach-hand-v2/icon-512.png')) throw new Error('PNG icons missing');
          fs.writeFileSync(p,h);
          console.log('Coach Hand PWA finalized:',Buffer.byteLength(h),'bytes');
          NODE
      - name: Commit final PWA and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/pwa-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-hand-v2/index.html .github/workflows/pwa-finalize.yml
          git commit -m "Finalize Coach Hand IA as installable PWA"
          git push
