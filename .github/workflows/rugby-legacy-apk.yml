name: Build Rugby Legacy APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rugby-legacy-android/**'
      - 'rl-v05/**'
      - 'rl-v06/**'
      - 'rl-v07/**'
      - 'rl-v08/**'
      - 'rl-v09/**'
      - 'rl-v10/**'
      - 'rl-v11/**'
      - 'rl-v12/**'
      - 'rl-v13/**'
      - 'rl-v14/**'
      - 'rl-v15/**'
      - 'rl-v16/**'
      - '.github/workflows/rugby-legacy-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Rebuild verified Rugby Legacy base bundle
        run: |
          cat rugby-legacy-android/wp-00 rugby-legacy-android/wp-01 rugby-legacy-android/wp-02 rugby-legacy-android/wp-03 rugby-legacy-android/wp-04 rugby-legacy-android/wp-05 rugby-legacy-android/wp-06 rugby-legacy-android/wp-07 > rugby-legacy-android/web-bundle-fixed.zip
          test "$(stat -c%s rugby-legacy-android/web-bundle-fixed.zip)" = "21731"
          unzip -t rugby-legacy-android/web-bundle-fixed.zip
          rm -rf rugby-legacy-android/app/src/main/assets/www
          mkdir -p rugby-legacy-android/app/src/main/assets/www/icons
          unzip -q rugby-legacy-android/web-bundle-fixed.zip -d rugby-legacy-android/app/src/main/assets/www

      - name: Apply brand and all game upgrades through v1.6
        run: |
          cp rugby-legacy-android/upgrade-v04.js rugby-legacy-android/app/src/main/assets/www/upgrade-v04.js
          cp rugby-legacy-android/upgrade-v04.css rugby-legacy-android/app/src/main/assets/www/upgrade-v04.css
          cp rugby-legacy-android/brand-logo.svg rugby-legacy-android/app/src/main/assets/www/icons/brand-logo.svg
          cp rugby-legacy-android/mark.svg rugby-legacy-android/app/src/main/assets/www/icons/mark.svg
          cp rugby-legacy-android/mark.svg rugby-legacy-android/app/src/main/assets/www/icons/icon.svg
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v04.js

          for v in 05 06 07 08 09 10 11 12; do
            cp "rl-v${v}/upgrade-v${v}.js" "rugby-legacy-android/app/src/main/assets/www/upgrade-v${v}.js"
            cp "rl-v${v}/upgrade-v${v}.css" "rugby-legacy-android/app/src/main/assets/www/upgrade-v${v}.css"
            node --check "rugby-legacy-android/app/src/main/assets/www/upgrade-v${v}.js"
          done

          cat rl-v13/upgrade-v13.part00 rl-v13/upgrade-v13.part01 rl-v13/upgrade-v13.part02 rl-v13/upgrade-v13.part03 rl-v13/upgrade-v13.part04 > rugby-legacy-android/app/src/main/assets/www/upgrade-v13.js
          cp rl-v13/upgrade-v13.css rugby-legacy-android/app/src/main/assets/www/upgrade-v13.css
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v13.js

          cat rl-v14/upgrade-v14.part00 rl-v14/upgrade-v14.part01 rl-v14/upgrade-v14.part02 rl-v14/upgrade-v14.part03 rl-v14/upgrade-v14.part04 rl-v14/upgrade-v14.part05 > rugby-legacy-android/app/src/main/assets/www/upgrade-v14.js
          cp rl-v14/upgrade-v14.css rugby-legacy-android/app/src/main/assets/www/upgrade-v14.css
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v14.js

          cat rl-v15/upgrade-v15.part00 rl-v15/upgrade-v15.part01 rl-v15/upgrade-v15.part02 rl-v15/upgrade-v15.part03 rl-v15/upgrade-v15.part04 rl-v15/upgrade-v15.part05 > rugby-legacy-android/app/src/main/assets/www/upgrade-v15.js
          cp rl-v15/upgrade-v15.css rugby-legacy-android/app/src/main/assets/www/upgrade-v15.css
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v15.js

          cat rl-v16/upgrade-v16.part00 rl-v16/upgrade-v16.part01 rl-v16/upgrade-v16.part02 rl-v16/upgrade-v16.part03 rl-v16/upgrade-v16.part04 rl-v16/upgrade-v16.part05 > rugby-legacy-android/app/src/main/assets/www/upgrade-v16.js
          cp rl-v16/upgrade-v16.css rugby-legacy-android/app/src/main/assets/www/upgrade-v16.css
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v16.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path('rugby-legacy-android/app/src/main/assets/www/index.html')
          s=p.read_text()
          s=s.replace('icons/icon.svg','icons/mark.svg')
          versions=['04','05','06','07','08','09','10','11','12','13','14','15','16']
          css='\n'.join(f'  <link rel="stylesheet" href="upgrade-v{v}.css"/>' for v in versions)
          js='\n'.join(f'  <script src="upgrade-v{v}.js"></script>' for v in versions)
          s=s.replace('</head>',css+'\n</head>')
          s=s.replace('</body>',js+'\n</body>')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('rugby-legacy-android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 16', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '1.6'", s)
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p rugby-legacy-android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp rugby-legacy-android/app/build/outputs/apk/debug/app-debug.apk Rugby-Legacy-v1.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rugby-Legacy-Android-APK-v16
          path: Rugby-Legacy-v1.6.apk
          if-no-files-found: error
          retention-days: 7
