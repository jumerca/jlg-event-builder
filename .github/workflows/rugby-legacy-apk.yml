name: Build Rugby Legacy APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rugby-legacy-android/**'
      - '.github/workflows/rugby-legacy-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Rebuild and verify Rugby Legacy web bundle
        run: |
          cat rugby-legacy-android/webpart-00 rugby-legacy-android/webpart-01 rugby-legacy-android/webpart-02 rugby-legacy-android/webpart-03 > rugby-legacy-android/web-bundle-fixed.zip
          unzip -t rugby-legacy-android/web-bundle-fixed.zip
          mkdir -p rugby-legacy-android/app/src/main/assets/www
          unzip -q rugby-legacy-android/web-bundle-fixed.zip -d rugby-legacy-android/app/src/main/assets/www
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p rugby-legacy-android :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp rugby-legacy-android/app/build/outputs/apk/debug/app-debug.apk Rugby-Legacy-v0.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rugby-Legacy-Android-APK
          path: Rugby-Legacy-v0.3.apk
          if-no-files-found: error
          retention-days: 7
