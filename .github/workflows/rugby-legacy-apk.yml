name: Build Rugby Legacy APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rugby-legacy-android/**'
      - 'rl-v05/**'
      - 'rl-v06/**'
      - 'rl-v07/**'
      - 'rl-v08/**'
      - 'rl-v09/**'
      - 'rl-v10/**'
      - '.github/workflows/rugby-legacy-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Rebuild verified Rugby Legacy base bundle
        run: |
          cat rugby-legacy-android/wp-00 rugby-legacy-android/wp-01 rugby-legacy-android/wp-02 rugby-legacy-android/wp-03 rugby-legacy-android/wp-04 rugby-legacy-android/wp-05 rugby-legacy-android/wp-06 rugby-legacy-android/wp-07 > rugby-legacy-android/web-bundle-fixed.zip
          test "$(stat -c%s rugby-legacy-android/web-bundle-fixed.zip)" = "21731"
          unzip -t rugby-legacy-android/web-bundle-fixed.zip
          rm -rf rugby-legacy-android/app/src/main/assets/www
          mkdir -p rugby-legacy-android/app/src/main/assets/www/icons
          unzip -q rugby-legacy-android/web-bundle-fixed.zip -d rugby-legacy-android/app/src/main/assets/www
      - name: Apply Rugby Legacy v0.4 base upgrade
        run: |
          cp rugby-legacy-android/upgrade-v04.js rugby-legacy-android/app/src/main/assets/www/upgrade-v04.js
          cp rugby-legacy-android/upgrade-v04.css rugby-legacy-android/app/src/main/assets/www/upgrade-v04.css
          cp rugby-legacy-android/brand-logo.svg rugby-legacy-android/app/src/main/assets/www/icons/brand-logo.svg
          cp rugby-legacy-android/mark.svg rugby-legacy-android/app/src/main/assets/www/icons/mark.svg
          cp rugby-legacy-android/mark.svg rugby-legacy-android/app/src/main/assets/www/icons/icon.svg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rugby-legacy-android/app/src/main/assets/www/index.html')
          s=p.read_text()
          s=s.replace('<link rel="stylesheet" href="styles.css"/>','<link rel="stylesheet" href="styles.css"/>\n  <link rel="stylesheet" href="upgrade-v04.css"/>')
          s=s.replace('<script src="app.js"></script>','<script src="app.js"></script>\n  <script src="upgrade-v04.js"></script>')
          s=s.replace('icons/icon.svg','icons/mark.svg')
          p.write_text(s)
          PY
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v04.js
      - name: Apply Rugby Legacy v0.5 match engine
        run: |
          cp rl-v05/upgrade-v05.js rugby-legacy-android/app/src/main/assets/www/upgrade-v05.js
          cp rl-v05/upgrade-v05.css rugby-legacy-android/app/src/main/assets/www/upgrade-v05.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rugby-legacy-android/app/src/main/assets/www/index.html')
          s=p.read_text().replace('</head>','  <link rel="stylesheet" href="upgrade-v05.css"/>\n</head>').replace('</body>','  <script src="upgrade-v05.js"></script>\n</body>')
          p.write_text(s)
          PY
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v05.js
          sed -i "s/versionCode 3/versionCode 5/; s/versionName '0.3'/versionName '0.5'/" rugby-legacy-android/app/build.gradle
      - name: Apply Rugby Legacy v0.6 visual engine
        run: |
          cp rl-v06/upgrade-v06.js rugby-legacy-android/app/src/main/assets/www/upgrade-v06.js
          cp rl-v06/upgrade-v06.css rugby-legacy-android/app/src/main/assets/www/upgrade-v06.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rugby-legacy-android/app/src/main/assets/www/index.html')
          s=p.read_text().replace('</head>','  <link rel="stylesheet" href="upgrade-v06.css"/>\n</head>').replace('</body>','  <script src="upgrade-v06.js"></script>\n</body>')
          p.write_text(s)
          PY
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v06.js
          sed -i "s/versionCode 5/versionCode 6/; s/versionName '0.5'/versionName '0.6'/" rugby-legacy-android/app/build.gradle
      - name: Apply Rugby Legacy v0.7 PRM renderer
        run: |
          cp rl-v07/upgrade-v07.js rugby-legacy-android/app/src/main/assets/www/upgrade-v07.js
          cp rl-v07/upgrade-v07.css rugby-legacy-android/app/src/main/assets/www/upgrade-v07.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rugby-legacy-android/app/src/main/assets/www/index.html')
          s=p.read_text().replace('</head>','  <link rel="stylesheet" href="upgrade-v07.css"/>\n</head>').replace('</body>','  <script src="upgrade-v07.js"></script>\n</body>')
          p.write_text(s)
          PY
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v07.js
          sed -i "s/versionCode 6/versionCode 7/; s/versionName '0.6'/versionName '0.7'/" rugby-legacy-android/app/build.gradle
      - name: Apply Rugby Legacy v0.8 PRM resemblance pass
        run: |
          cp rl-v08/upgrade-v08.js rugby-legacy-android/app/src/main/assets/www/upgrade-v08.js
          cp rl-v08/upgrade-v08.css rugby-legacy-android/app/src/main/assets/www/upgrade-v08.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rugby-legacy-android/app/src/main/assets/www/index.html')
          s=p.read_text().replace('</head>','  <link rel="stylesheet" href="upgrade-v08.css"/>\n</head>').replace('</body>','  <script src="upgrade-v08.js"></script>\n</body>')
          p.write_text(s)
          PY
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v08.js
          sed -i "s/versionCode 7/versionCode 8/; s/versionName '0.7'/versionName '0.8'/" rugby-legacy-android/app/build.gradle
      - name: Apply Rugby Legacy v0.9 continuous choreography
        run: |
          cp rl-v09/upgrade-v09.js rugby-legacy-android/app/src/main/assets/www/upgrade-v09.js
          cp rl-v09/upgrade-v09.css rugby-legacy-android/app/src/main/assets/www/upgrade-v09.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rugby-legacy-android/app/src/main/assets/www/index.html')
          s=p.read_text().replace('</head>','  <link rel="stylesheet" href="upgrade-v09.css"/>\n</head>').replace('</body>','  <script src="upgrade-v09.js"></script>\n</body>')
          p.write_text(s)
          PY
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v09.js
          sed -i "s/versionCode 8/versionCode 9/; s/versionName '0.8'/versionName '0.9'/" rugby-legacy-android/app/build.gradle
      - name: Apply Rugby Legacy v1.0 multi-system PRM overhaul
        run: |
          cp rl-v10/upgrade-v10.js rugby-legacy-android/app/src/main/assets/www/upgrade-v10.js
          cp rl-v10/upgrade-v10.css rugby-legacy-android/app/src/main/assets/www/upgrade-v10.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rugby-legacy-android/app/src/main/assets/www/index.html')
          s=p.read_text().replace('</head>','  <link rel="stylesheet" href="upgrade-v10.css"/>\n</head>').replace('</body>','  <script src="upgrade-v10.js"></script>\n</body>')
          p.write_text(s)
          PY
          node --check rugby-legacy-android/app/src/main/assets/www/upgrade-v10.js
          sed -i "s/versionCode 9/versionCode 10/; s/versionName '0.9'/versionName '1.0'/" rugby-legacy-android/app/build.gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p rugby-legacy-android :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp rugby-legacy-android/app/build/outputs/apk/debug/app-debug.apk Rugby-Legacy-v1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rugby-Legacy-Android-APK-v10
          path: Rugby-Legacy-v1.0.apk
          if-no-files-found: error
          retention-days: 7
