<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081f36" />
  <meta name="description" content="Coach Hand IA — assistant intelligent pour entraîneurs de handball" />
  <title>Coach Hand IA</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach Hand IA" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="./app.css" />
  <style>
    #launchScreen{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:#081f36;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;transition:opacity .22s ease}
    #launchScreen .launchBox{text-align:center}
    #launchScreen img{width:108px;height:108px;border-radius:25px;display:block;margin:0 auto 18px;box-shadow:0 18px 42px rgba(0,0,0,.25)}
    #launchScreen strong{font-size:28px;letter-spacing:-.02em}
    #launchScreen small{display:block;margin-top:7px;color:#bdd0e0;font-size:14px}
  </style>
</head>
<body>
  <div id="launchScreen"><div class="launchBox"><img src="./icon.svg" alt=""><strong>Coach Hand IA</strong><small>Le handball, côté coach.</small></div></div>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Accueil">
        <span class="brand-mark"><img class="brand-logo" src="./icon.svg" alt="" /></span>
        <span><strong>Coach Hand</strong><em>IA</em></span>
      </button>
      <div class="top-actions">
        <button class="cloud-pill" data-nav="account" id="cloudPill" aria-label="Compte et synchronisation"><span class="cloud-dot offline" id="cloudDot"></span><span id="cloudPillText">Hors ligne</span></button>
        <button class="icon-btn" id="installBtn" hidden aria-label="Installer l'application">⬇</button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <button data-nav="home" class="nav-item active"><span>⌂</span><small>Accueil</small></button>
      <button data-nav="generator" class="nav-item"><span>✦</span><small>Créer</small></button>
      <button data-nav="library" class="nav-item"><span>▦</span><small>Exercices</small></button>
      <button data-nav="season" class="nav-item"><span>◫</span><small>Saison</small></button>
      <button data-nav="tactics" class="nav-item"><span>⌁</span><small>Tactique</small></button>
    </nav>
  </div>
  <script src="./app.js"></script>
  <script>
    (function(){
      const splash=document.getElementById('launchScreen');
      requestAnimationFrame(()=>setTimeout(()=>{if(splash){splash.style.opacity='0';setTimeout(()=>splash.remove(),240)}},120));
      if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(console.warn));}
    })();
  </script>
</body>
</html>
